<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartNavigator</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#080b11;--panel:#111722;--line:#293244;--muted:#8d98aa;--up:#26a69a;--down:#ef5350}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f4f8;font:14px system-ui,sans-serif}button,input,select{font:inherit;color:#fff;background:#151c28;border:1px solid #39465c;border-radius:7px;padding:9px}button{cursor:pointer}.hidden{display:none!important}
    header{padding:18px 5vw;border-bottom:1px solid var(--line)}header h1{margin:0}.container{max-width:1320px;margin:auto;padding:24px 18px}.search{display:flex;max-width:700px;margin:22px auto;gap:8px}.search input{flex:1}.market-tabs{display:flex;justify-content:center;margin:20px}.rank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}.rank-row{display:grid;grid-template-columns:25px 1fr auto;padding:9px 3px;border-bottom:1px solid #222b39;cursor:pointer}.up{color:var(--up)}.down{color:var(--down)}.empty{padding:18px;color:var(--muted)}
    .analysis-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:15px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar strong{margin-right:auto}.toggle{font-size:12px;white-space:nowrap}.toggle input{width:auto}#chart{height:470px}#volume-chart{height:140px;border-top:1px solid var(--line)}.signal{padding:12px;border-radius:7px;background:#303846;text-align:center;font-weight:700}.error{color:#ff9d9d}
    #results{max-width:700px;margin:-15px auto 20px}.result{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover,.rank-row:hover{background:#182130}
    @media(max-width:760px){.container{padding:14px 10px}.rank-grid,.layout{grid-template-columns:1fr}.search{margin:14px 0}.market-tabs{margin:14px 0}.market-tabs select{width:100%}#chart{height:350px}.toolbar strong{width:100%}.toolbar select{flex:1}.analysis-head{position:sticky;top:0;background:var(--bg);z-index:3;padding:8px 0}}
  </style>
</head>
<body>
<header><h1>SmartNavigator</h1><small>市場排行與多週期策略分析</small></header>
<main class="container">
  <section id="home-page">
    <h2>選擇市場或搜尋商品</h2>
    <div class="search"><input id="search-input" placeholder="例如：2330.TW、AAPL、GLD、BTC-USDT"><button id="search-button">搜尋</button></div>
    <div id="results" class="panel hidden"></div>
    <div class="market-tabs"><select id="market-select"><option value="futures">合約市場（OKX）</option><option value="taiwan">台股市場（含台股 ETF）</option><option value="us">美股市場（含美國 ETF／美債）</option><option value="metals">貴金屬市場</option></select></div>
    <div id="ranking-error" class="error"></div>
    <div class="rank-grid"><section class="panel"><h3>漲幅 Top 10</h3><div id="gainers"></div></section><section class="panel"><h3>跌幅 Top 10</h3><div id="losers"></div></section><section class="panel"><h3>成交量 Top 10</h3><div id="volumes"></div></section></div>
  </section>
  <section id="analysis-page" class="hidden">
    <div class="analysis-head"><button id="back-button">← 返回排行榜</button><span id="source-status"></span></div>
    <div class="layout"><section class="panel"><div class="toolbar"><strong id="chart-title">分析圖表</strong><select id="interval"><option value="1m">1 分</option><option value="5m">5 分</option><option value="15m">15 分</option><option value="1h" selected>1 小時</option><option value="4h">4 小時</option><option value="1d">日線</option></select><label class="toggle"><input id="toggle-ema" type="checkbox"> EMA</label><label class="toggle"><input id="toggle-levels" type="checkbox"> 撐壓</label><label class="toggle"><input id="toggle-choch" type="checkbox"> CHoCH</label><label class="toggle"><input id="toggle-fvg" type="checkbox"> FVG</label><label class="toggle"><input id="toggle-volume" type="checkbox"> 成交量</label></div><div id="chart"></div><div id="volume-chart" class="hidden"></div></section><aside class="panel"><h3>策略分析</h3><div id="signal" class="signal">等待分析</div><p id="reason"></p><p id="analysis-error" class="error"></p></aside></div>
  </section>
</main>
<script>
(() => {
  const byId = id => document.getElementById(id);
  let activeSymbol = '';
  let rankingData = {};
  let structureData = null;
  let levelsData = null;
  let chochLines = [], fvgLines = [], levelLines = [];

  const chart = LightweightCharts.createChart(byId('chart'), {layout:{background:{color:'#111722'},textColor:'#d7dce5'},grid:{vertLines:{color:'#202938'},horzLines:{color:'#202938'}},timeScale:{timeVisible:true}});
  const volumeChart = LightweightCharts.createChart(byId('volume-chart'), {layout:{background:{color:'#111722'},textColor:'#8d98aa'},timeScale:{visible:false}});
  const candles = chart.addSeries(LightweightCharts.CandlestickSeries, {upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  const volumeSeries = volumeChart.addSeries(LightweightCharts.HistogramSeries, {priceFormat:{type:'volume'}});
  const emaFast = chart.addSeries(LightweightCharts.LineSeries, {color:'#f0b90b',priceLineVisible:false,lastValueVisible:false,visible:false});
  const emaSlow = chart.addSeries(LightweightCharts.LineSeries, {color:'#00d4ff',priceLineVisible:false,lastValueVisible:false,visible:false});
  const emaTrend = chart.addSeries(LightweightCharts.LineSeries, {color:'#a78bfa',priceLineVisible:false,lastValueVisible:false,visible:false});

  function removeLines(lines){ lines.forEach(line => candles.removePriceLine(line)); return []; }
  function drawIndicators(){
    const showEma = byId('toggle-ema').checked;
    emaFast.applyOptions({visible:showEma}); emaSlow.applyOptions({visible:showEma}); emaTrend.applyOptions({visible:showEma});
    chochLines=removeLines(chochLines); fvgLines=removeLines(fvgLines); levelLines=removeLines(levelLines);
    if(byId('toggle-choch').checked && structureData?.choch){ const bull=structureData.choch.direction==='bullish'; chochLines.push(candles.createPriceLine({price:structureData.choch.level,color:bull?'#00d4ff':'#ff4560',lineWidth:2,title:'CHoCH'})); }
    if(byId('toggle-fvg').checked) (structureData?.fvg_zones||[]).forEach(zone=>{const color=zone.side==='bullish'?'#b56cff':'#ff9f43';fvgLines.push(candles.createPriceLine({price:zone.low,color,lineStyle:2,title:'FVG'}),candles.createPriceLine({price:zone.high,color,lineStyle:2,title:'FVG'}));});
    if(byId('toggle-levels').checked && levelsData){levelLines.push(candles.createPriceLine({price:levelsData.resistance,color:'#f59e0b',title:'壓力'}),candles.createPriceLine({price:levelsData.support,color:'#26a69a',title:'支撐'}));}
    byId('volume-chart').classList.toggle('hidden', !byId('toggle-volume').checked);
  }

  function rankingRows(target, rows, volumeMode=false){
    const box=byId(target); box.replaceChildren();
    if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='此市場資料暫時無法取得';box.append(empty);return;}
    rows.forEach((item,index)=>{const row=document.createElement('div');row.className='rank-row';const value=volumeMode?`${(item.volume/1e6).toFixed(1)}M`:`${item.change>0?'+':''}${item.change}%`;row.innerHTML=`<small>${index+1}</small><span>${item.name}<small> ${item.price}</small></span><b class="${item.change>=0?'up':'down'}">${value}</b>`;row.onclick=()=>openAnalysis(item.symbol);box.append(row);});
  }
  function renderRanking(){const market=rankingData[byId('market-select').value]||{};rankingRows('gainers',market.gainers||[]);rankingRows('losers',market.losers||[]);rankingRows('volumes',market.volume||[],true);}
  async function loadRankings(){try{const response=await fetch('/api/market-rankings');const data=await response.json();if(!response.ok)throw new Error(data.detail||'排行榜載入失敗');rankingData=data.markets||{};byId('ranking-error').textContent='';renderRanking();}catch(error){byId('ranking-error').textContent=error.message;renderRanking();}}

  async function search(){const keyword=byId('search-input').value.trim();if(!keyword)return;const box=byId('results');box.classList.remove('hidden');box.textContent='搜尋中…';try{const response=await fetch('/api/search?keyword='+encodeURIComponent(keyword));const data=await response.json();box.replaceChildren();(data.results||[]).slice(0,15).forEach(item=>{const row=document.createElement('div');row.className='result';row.textContent=`${item.symbol} · ${item.name||''} · ${item.exchange||''}`;row.onclick=()=>openAnalysis(item.symbol);box.append(row);});if(!box.children.length)box.textContent='找不到商品';}catch(error){box.textContent='搜尋暫時失敗';}}
  async function openAnalysis(symbol){activeSymbol=symbol;byId('home-page').classList.add('hidden');byId('analysis-page').classList.remove('hidden');chart.applyOptions({width:byId('chart').clientWidth});volumeChart.applyOptions({width:byId('chart').clientWidth});byId('chart-title').textContent=symbol;byId('analysis-error').textContent='';byId('signal').textContent='資料載入中…';try{const response=await fetch('/api/analyze?symbol='+encodeURIComponent(symbol)+'&interval='+byId('interval').value);const data=await response.json();if(!response.ok)throw new Error(data.detail||'分析失敗');candles.setData(data.chart_data||[]);volumeSeries.setData((data.chart_data||[]).map(c=>({time:c.time,value:c.volume||0,color:c.close>=c.open?'#26a69a99':'#ef535099'})));emaFast.setData(data.ema_data?.fast||[]);emaSlow.setData(data.ema_data?.slow||[]);emaTrend.setData(data.ema_data?.trend||[]);structureData=data.structure;levelsData=data.levels;drawIndicators();chart.timeScale().fitContent();volumeChart.timeScale().fitContent();byId('source-status').textContent='資料來源：'+data.market_source;byId('signal').textContent=data.message;byId('reason').textContent=data.reason;}catch(error){byId('signal').textContent='無法生成圖表';byId('analysis-error').textContent=error.message;}}

  byId('search-button').onclick=search; byId('search-input').onkeydown=e=>{if(e.key==='Enter')search();}; byId('market-select').onchange=renderRanking; byId('back-button').onclick=()=>{byId('analysis-page').classList.add('hidden');byId('home-page').classList.remove('hidden');}; byId('interval').onchange=()=>activeSymbol&&openAnalysis(activeSymbol); ['toggle-ema','toggle-levels','toggle-choch','toggle-fvg','toggle-volume'].forEach(id=>byId(id).onchange=drawIndicators);
  new ResizeObserver(entries=>{chart.applyOptions({width:entries[0].contentRect.width});volumeChart.applyOptions({width:entries[0].contentRect.width});}).observe(byId('chart'));
  loadRankings();
})();
</script>
</body></html>
