<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartNavigator</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#05070b;--panel:#0b1118;--panel2:#101923;--line:#27495a;--cyan:#41e7ff;--lime:#7cff6b;--amber:#ffd166;--muted:#78909c;--up:#34f5a0;--down:#ff5577;--pixel-shadow:#020305}
    *{box-sizing:border-box}html{image-rendering:pixelated}body{margin:0;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(rgba(65,231,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(65,231,255,.035) 1px,transparent 1px);background-size:16px 16px;color:#e9fbff;font:14px "Cascadia Mono","Consolas","Courier New",monospace;letter-spacing:.02em}body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.07) 3px 4px)}button,input,select{font:inherit;color:#e9fbff;background:#071019;border:2px solid var(--line);border-radius:0;padding:9px 11px;outline:none;box-shadow:3px 3px 0 var(--pixel-shadow)}button{cursor:pointer;text-transform:uppercase}button:hover,select:hover,input:focus{border-color:var(--cyan);color:#fff;box-shadow:3px 3px 0 #123b49}button:active{transform:translate(3px,3px);box-shadow:none}.hidden{display:none!important}#analysis-page.hidden{display:block!important;position:absolute;visibility:hidden;left:-10000px;width:calc(100vw - 36px)}
    header{position:relative;padding:18px 5vw;background:#070c12;border-bottom:3px solid var(--cyan);box-shadow:0 4px 0 #102a35}header:before{content:"[ SYSTEM ONLINE ]";position:absolute;right:5vw;top:22px;color:var(--lime);font-size:11px;text-shadow:0 0 8px var(--lime)}header h1{margin:0;color:var(--cyan);font-size:23px;letter-spacing:.12em;text-shadow:2px 2px 0 #06485a}header h1:before{content:">_ ";color:var(--lime)}header small{color:var(--muted)}.container{max-width:1320px;margin:auto;padding:26px 18px}.container h2,.container h3{color:var(--cyan);letter-spacing:.08em}.container h2:before,.container h3:before{content:"// ";color:var(--lime)}
    .search{display:flex;max-width:760px;margin:24px auto;gap:8px}.search input{flex:1;border-color:#326175}.search button{min-width:90px;background:#09212b;color:var(--cyan)}.market-tabs{display:flex;justify-content:center;gap:10px;margin:22px}.panel{position:relative;background:linear-gradient(135deg,rgba(15,26,36,.97),rgba(7,13,20,.98));border:2px solid var(--line);border-radius:0;padding:15px;box-shadow:6px 6px 0 var(--pixel-shadow)}.panel:before,.panel:after{content:"";position:absolute;width:7px;height:7px;background:var(--cyan)}.panel:before{left:-2px;top:-2px}.panel:after{right:-2px;bottom:-2px}.rank-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;padding:11px 7px;border-bottom:1px dashed #24404d;cursor:pointer}.rank-row:hover,.result:hover{background:#102b35;color:#fff}.rank-row small:first-child{color:var(--amber)}.up{color:var(--up);text-shadow:0 0 7px rgba(52,245,160,.35)}.down{color:var(--down);text-shadow:0 0 7px rgba(255,85,119,.35)}.empty{padding:22px;color:var(--muted);text-align:center}.empty:after{content:" _";animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    .analysis-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}.analysis-head span{color:var(--lime)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}.toolbar strong{margin-right:auto;color:var(--cyan);font-size:15px}.toggle{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;color:#b9d5dc}.toggle input{appearance:none;width:14px;height:14px;padding:0;border:2px solid #52717d;box-shadow:none}.toggle input:checked{background:var(--lime);border-color:var(--lime);box-shadow:inset 0 0 0 2px #071019}#chart{height:470px;border:1px solid #1d3642;background:#05080c}#volume-chart{height:140px;border:1px solid #1d3642;border-top:2px solid var(--cyan)}.signal{padding:14px;border:2px solid #53616f;border-radius:0;background:#18232e;text-align:center;font-weight:700;box-shadow:3px 3px 0 #030507}.signal.BUY{border-color:var(--up);color:var(--up)}.signal.SELL{border-color:var(--down);color:var(--down)}.error{color:#ff8399}#results{max-width:760px;margin:-16px auto 22px;z-index:5}.result{padding:11px;border-bottom:1px dashed var(--line);cursor:pointer}
    @media(max-width:760px){body{font-size:13px;background-size:12px 12px}header{padding:14px 12px}header:before{display:none}header h1{font-size:18px}.container{padding:14px 10px}.layout{grid-template-columns:1fr}.search{margin:14px 0}.search button{min-width:72px}.market-tabs{margin:14px 0;display:grid;grid-template-columns:1fr 1fr}.market-tabs select{width:100%}#chart{height:350px}.toolbar strong{width:100%;margin:0}.toolbar select{flex:1;min-width:95px}.toggle{padding:5px 2px}.analysis-head{position:sticky;top:0;background:var(--bg);z-index:4;padding:8px 0}.panel{padding:11px;box-shadow:4px 4px 0 var(--pixel-shadow)}}
  </style>
  <style>
    /* Retro creature-battle handheld theme; no third-party character assets. */
    :root{--bg:#75c9df;--panel:#dce9c8;--panel2:#cbdcb5;--line:#17345f;--cyan:#eff8c9;--lime:#3b8f58;--muted:#536879;--pixel-shadow:#122844}
    body{color:#13222c;background-color:#75c9df;background-image:radial-gradient(ellipse at 12% 14%,#f4f5d8 0 5%,transparent 5.5%),radial-gradient(ellipse at 88% 18%,#f4f5d8 0 6%,transparent 6.5%),linear-gradient(#62bad5 0 30%,#9cdeea 30% 100%);background-attachment:fixed}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;border:10px solid #203e73;z-index:98;box-shadow:inset 0 0 0 5px #0e274d}
    header{margin:10px;border:4px solid #10294f;background:#254579;box-shadow:inset 0 0 0 3px #496aa0,5px 5px 0 #10243e;color:#eff8c9}
    header h1{color:#eff8c9;text-shadow:3px 3px 0 #18325c}header small{color:#cfe4cb}header:before{color:#b8ee97;text-shadow:none}
    .container{background:rgba(116,207,226,.82);border-left:4px solid #234475;border-right:4px solid #234475;min-height:calc(100vh - 108px)}
    .container h2,.container h3{color:#24406c}.container h2:before,.container h3:before{color:#4d874e}
    button,input,select{color:#152531;background:#e2edcd;border:3px solid #17345f;box-shadow:inset -2px -2px 0 #aabf9a,inset 2px 2px 0 #fff,4px 4px 0 #10243e}
    button:hover,select:hover,input:focus{border-color:#31588d;color:#10203a;background:#f1f6dc;box-shadow:inset -2px -2px 0 #aabf9a,inset 2px 2px 0 #fff,4px 4px 0 #10243e}
    .panel{color:#14232c;background:linear-gradient(#e6efd2,#ceddb9);border:4px solid #132f58;box-shadow:inset 0 0 0 3px #718aa0,inset 0 0 0 6px #f1f5dc,6px 6px 0 #10243e;padding:18px}
    .panel:before,.panel:after{background:#2b4f82}.rank-row{border-bottom:2px dashed #789084}.rank-row:hover,.result:hover{background:#bed4ad}.analysis-head{background:#dce9c8;border:3px solid #17345f;padding:9px;box-shadow:4px 4px 0 #10243e}.analysis-head span{color:#244c3b}
    .toolbar{border-bottom:3px double #37567a}.toolbar strong{color:#1d3b6b}.toggle{color:#273d47}.toggle input{background:#eff4dc;border-color:#24436e}.toggle input:checked{background:#65ad61;border-color:#234d39;box-shadow:inset 0 0 0 2px #e8f4d5}
    .signal{position:relative;overflow:hidden;color:#26333a;background:rgba(205,213,211,.58);border:3px solid #697983;box-shadow:inset 0 0 18px rgba(255,255,255,.65),4px 4px 0 #10243e;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    .signal:after{content:"";position:absolute;inset:2px;background:linear-gradient(125deg,rgba(255,255,255,.48),transparent 38%,rgba(255,255,255,.12) 65%,transparent);pointer-events:none}
    .signal.BUY{color:#155d37;background:rgba(74,207,117,.33);border-color:#247448;text-shadow:0 1px rgba(255,255,255,.6)}
    .signal.SELL{color:#8b2338;background:rgba(245,82,107,.28);border-color:#a63249;text-shadow:0 1px rgba(255,255,255,.6)}
    .signal.HOLD{color:#52606a;background:rgba(200,207,211,.48);border-color:#7a8790}
    .analysis-search{display:flex;gap:7px;flex:1;max-width:520px}.analysis-search input{flex:1;min-width:120px}.search-results{margin:0 0 14px;z-index:6}.empty{color:#536879}.up{color:#19734b;text-shadow:none}.down{color:#b42848;text-shadow:none}
    @media(max-width:760px){body:before{border-width:5px}.container{border-width:2px}.analysis-head{flex-wrap:wrap}.analysis-search{order:3;min-width:100%;max-width:none}.analysis-search button{min-width:70px}.panel{border-width:3px;padding:12px}}
  </style>
  <style>
    /* Reduced-noise refinement */
    body{background:#86cfdf;background-image:none}
    body:after{display:none}body:before{border-width:6px;box-shadow:inset 0 0 0 2px #0e274d}
    .container{background:rgba(134,207,223,.94)}
    header,.panel{box-shadow:3px 3px 0 #10243e}
    .panel{background:#dce9c8;box-shadow:inset 0 0 0 2px #f1f5dc,3px 3px 0 #10243e}
    .panel:before,.panel:after{display:none}
    .rank-row small{color:#243b5e;font-weight:700}.rank-row small:first-child{color:#243b5e}.rank-row span small{color:#263c54}.rank-row b{font-weight:900}
    .signal{font-size:15px;line-height:1.55;border-width:4px;box-shadow:inset 0 0 24px rgba(255,255,255,.68),4px 4px 0 #10243e}
    .signal.BUY{color:#064d28;background:rgba(42,210,100,.52);border-color:#08733b;box-shadow:inset 0 0 22px rgba(231,255,237,.72),0 0 0 3px rgba(29,137,70,.22),4px 4px 0 #10243e}
    .signal.SELL{color:#77152b;background:rgba(250,65,95,.46);border-color:#a31232;box-shadow:inset 0 0 22px rgba(255,231,235,.68),0 0 0 3px rgba(174,24,56,.20),4px 4px 0 #10243e}
    .signal.HOLD{color:#3e4a52;background:rgba(196,204,208,.70);border-color:#66747c}
    .result{font-weight:700;color:#1b3150}.result:hover{background:#c6dcb6}
    .trade-plan{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0}.trade-plan div{padding:9px;border:2px solid #516b78;background:rgba(255,255,255,.30)}.trade-plan small{display:block;color:#586a72;margin-bottom:3px}.trade-plan b{color:#17345f}.history-list{display:grid;gap:7px}.history-item{padding:8px;border:2px solid #71808a;background:rgba(255,255,255,.25);font-size:12px}.history-item.TP1,.history-item.TP2{border-color:#278051;background:rgba(61,195,105,.20)}.history-item.SL{border-color:#a52c46;background:rgba(235,70,95,.18)}.history-item.OPEN{border-color:#66747c}.disclaimer{margin-top:15px;padding-top:11px;border-top:2px dashed #71808a;color:#5b666d;font-size:11px;line-height:1.6}
  </style>
</head>
<body>
<header><h1>SmartNavigator</h1><small>市場排行與多週期策略分析</small></header>
<main class="container">
  <section id="home-page">
    <h2>選擇市場或搜尋商品</h2>
    <div class="search"><input id="search-input" placeholder="例如：2330.TW、AAPL、GLD、BTC-USDT"><button id="search-button">搜尋</button></div>
    <div id="results" class="panel hidden"></div>
    <div class="market-tabs"><select id="market-select"><option value="futures">合約市場（OKX）</option><option value="taiwan">台股市場（含台股 ETF）</option><option value="us">美股市場（含美國 ETF／美債）</option><option value="metals">貴金屬市場</option></select><select id="ranking-select"><option value="gainers">漲幅榜</option><option value="losers">跌幅榜</option><option value="volume">成交量榜</option></select></div>
    <div id="ranking-error" class="error"></div>
    <section class="panel"><h3 id="ranking-title">漲幅 Top 10</h3><div id="ranking-list"><div class="empty">資料比對中…</div></div></section>
  </section>
  <section id="analysis-page" class="hidden">
    <div class="analysis-head"><button id="back-button">← 返回排行榜</button><div class="analysis-search"><input id="analysis-search-input" placeholder="搜尋其他商品"><button id="analysis-search-button">搜尋</button></div><span id="source-status"></span></div><div id="analysis-results" class="panel search-results hidden"></div>
    <div class="layout"><section class="panel"><div class="toolbar"><strong id="chart-title">分析圖表</strong><select id="interval"><optgroup label="分鐘"><option value="1m">1 分</option><option value="3m">3 分</option><option value="5m">5 分</option><option value="10m">10 分</option><option value="15m">15 分</option><option value="30m">30 分</option><option value="45m">45 分</option></optgroup><optgroup label="小時"><option value="1h" selected>1 小時</option><option value="2h">2 小時</option><option value="3h">3 小時</option><option value="4h">4 小時</option></optgroup><optgroup label="長週期"><option value="1d">日線</option><option value="1w">週線</option><option value="1mo">月線</option></optgroup></select><label class="toggle"><input id="toggle-ema" type="checkbox"> EMA</label><label class="toggle"><input id="toggle-levels" type="checkbox"> 撐壓</label><label class="toggle"><input id="toggle-choch" type="checkbox" checked> CHoCH</label><label class="toggle"><input id="toggle-fvg" type="checkbox"> FVG</label><label class="toggle"><input id="toggle-volume" type="checkbox"> 成交量</label></div><div id="chart"></div><div id="volume-chart" class="hidden"></div></section><aside class="panel"><h3>策略分析</h3><div id="signal" class="signal">等待分析</div><div id="trade-plan" class="trade-plan hidden"><div><small>進場價格</small><b id="entry-price">—</b></div><div><small>止損</small><b id="stop-price">—</b></div><div><small>止盈 1</small><b id="tp1-price">—</b></div><div><small>止盈 2</small><b id="tp2-price">—</b></div></div><p id="reason"></p><p id="analysis-error" class="error"></p><h3>策略訊號紀錄</h3><div id="signal-history" class="history-list"><div class="empty">尚無訊號紀錄</div></div><p class="disclaimer">注意事項：本策略分析與技術指標僅供研究及參考，不構成任何投資建議、邀約或獲利保證。金融商品具有風險，交易前請自行評估並承擔決策結果。</p></aside></div>
  </section>
</main>
<script>
(() => {
  const byId = id => document.getElementById(id);
  let activeSymbol = '';
  let rankingData = {};
  let structureData = null;
  let levelsData = null;
  let chochLines = [], fvgLines = [], levelLines = [], syncingRange = false, volumeSyncReady = false, markerPlugin = null;
  let volumeByTime = new Map();

  const chart = LightweightCharts.createChart(byId('chart'), {layout:{background:{color:'#05080c'},textColor:'#9ec8d3',fontFamily:'Consolas, monospace'},grid:{vertLines:{color:'#10202a'},horzLines:{color:'#10202a'}},crosshair:{vertLine:{color:'#9ec8d3',lineStyle:2},horzLine:{color:'#587986',lineStyle:2}},rightPriceScale:{borderColor:'#27495a'},timeScale:{borderColor:'#27495a',timeVisible:true}});
  let volumeChart = null, volumeSeries = null, lastChartData = [];
  const candles = chart.addSeries(LightweightCharts.CandlestickSeries, {upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  const emaFast = chart.addSeries(LightweightCharts.LineSeries, {color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false,visible:false});
  const emaSlow = chart.addSeries(LightweightCharts.LineSeries, {color:'#00d4ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false,visible:false});
  const emaTrend = chart.addSeries(LightweightCharts.LineSeries, {color:'#a78bfa',lineWidth:1,priceLineVisible:false,lastValueVisible:false,visible:false});

  function ensureVolumeChart(){
    if(!volumeChart){
      volumeChart=LightweightCharts.createChart(byId('volume-chart'),{layout:{background:{color:'#05080c'},textColor:'#78909c',fontFamily:'Consolas, monospace'},grid:{vertLines:{color:'#10202a'},horzLines:{color:'#10202a'}},crosshair:{vertLine:{visible:true,color:'#d8e7ea',lineStyle:2,labelVisible:false},horzLine:{visible:false}},width:byId('chart').clientWidth,height:140,timeScale:{visible:false}});
      volumeSeries=volumeChart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'}});
    }
    volumeSeries.setData(lastChartData.map(c=>({time:c.time,value:Number(c.volume)||0,color:c.close>=c.open?'#26a69a99':'#ef535099'})));
    volumeChart.applyOptions({width:byId('chart').clientWidth,height:140});
    if(!volumeSyncReady){
      chart.timeScale().subscribeVisibleLogicalRangeChange(range=>{if(!range||syncingRange)return;syncingRange=true;volumeChart.timeScale().setVisibleLogicalRange(range);syncingRange=false;});
      volumeChart.timeScale().subscribeVisibleLogicalRangeChange(range=>{if(!range||syncingRange)return;syncingRange=true;chart.timeScale().setVisibleLogicalRange(range);syncingRange=false;});
      chart.subscribeCrosshairMove(param=>{if(!volumeChart||param.time===undefined){volumeChart?.clearCrosshairPosition?.();return;}const value=volumeByTime.get(String(param.time))||0;if(volumeChart.setCrosshairPosition)volumeChart.setCrosshairPosition(value,param.time,volumeSeries);});
      volumeSyncReady=true;
    }
    const visibleRange=chart.timeScale().getVisibleLogicalRange();
    if(visibleRange)volumeChart.timeScale().setVisibleLogicalRange(visibleRange);else volumeChart.timeScale().fitContent();
  }


  function removeLines(lines){ lines.forEach(line => candles.removePriceLine(line)); return []; }
  function setChochMarkers(markers){if(typeof LightweightCharts.createSeriesMarkers==='function'){markerPlugin??=LightweightCharts.createSeriesMarkers(candles,[]);markerPlugin.setMarkers(markers);}else if(typeof candles.setMarkers==='function'){candles.setMarkers(markers);}}
  function drawIndicators(){
    const showEma = byId('toggle-ema').checked;
    emaFast.applyOptions({visible:showEma}); emaSlow.applyOptions({visible:showEma}); emaTrend.applyOptions({visible:showEma});
    chochLines=removeLines(chochLines); fvgLines=removeLines(fvgLines); levelLines=removeLines(levelLines);
    const showChoch=byId('toggle-choch').checked;setChochMarkers(showChoch?(structureData?.markers||[]):[]);
    if(showChoch && structureData?.choch){ const bull=structureData.choch.direction==='bullish'; chochLines.push(candles.createPriceLine({price:structureData.choch.level,color:bull?'#00d4ff':'#ff4560',lineWidth:2,title:'CHoCH'})); }
    if(byId('toggle-fvg').checked) (structureData?.fvg_zones||[]).forEach(zone=>{const color=zone.side==='bullish'?'#b56cff':'#ff9f43';fvgLines.push(candles.createPriceLine({price:zone.low,color,lineStyle:2,title:'FVG'}),candles.createPriceLine({price:zone.high,color,lineStyle:2,title:'FVG'}));});
    if(byId('toggle-levels').checked && levelsData){levelLines.push(candles.createPriceLine({price:levelsData.resistance,color:'#f59e0b',title:'壓力'}),candles.createPriceLine({price:levelsData.support,color:'#26a69a',title:'支撐'}));}
    const showVolume=byId('toggle-volume').checked;
    byId('volume-chart').classList.toggle('hidden', !showVolume);
    if(showVolume){requestAnimationFrame(ensureVolumeChart);}
  }

  function rankingRows(rows, volumeMode=false){
    const box=byId('ranking-list'); box.replaceChildren();
    if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='此市場資料暫時無法取得';box.append(empty);return;}
    rows.forEach((item,index)=>{const row=document.createElement('div');row.className='rank-row';const value=volumeMode?`${(item.volume/1e6).toFixed(1)}M`:`${item.change>0?'+':''}${item.change}%`;row.innerHTML=`<small>${index+1}</small><span>${item.name}<small> ${item.price}</small></span><b class="${item.change>=0?'up':'down'}">${value}</b>`;row.onclick=()=>openAnalysis(item.symbol);box.append(row);});
  }
  async function loadRankings(){const market=byId('market-select').value;const ranking=byId('ranking-select').value;const labels={gainers:'漲幅',losers:'跌幅',volume:'成交量'};byId('ranking-title').textContent=labels[ranking]+' Top 10';byId('ranking-error').textContent='';byId('ranking-list').innerHTML='<div class="empty">資料比對中…</div>';try{const response=await fetch('/api/market-ranking?market='+encodeURIComponent(market)+'&ranking='+encodeURIComponent(ranking));const data=await response.json();if(!response.ok)throw new Error(data.detail||'排行榜載入失敗');rankingRows(data.results||[],ranking==='volume');}catch(error){byId('ranking-error').textContent=error.message;rankingRows([],ranking==='volume');}}

  function compactSymbol(item){const symbol=String(item.symbol||'');if(symbol.startsWith('OKX:')){const raw=symbol.slice(4);const perpetual=raw.endsWith('-SWAP');const clean=raw.replace('-SWAP','').replaceAll('-','');return clean+(perpetual?'.P':'')+':OKX';}if(symbol.endsWith('.TW'))return symbol.slice(0,-3)+':TWSE';if(symbol.endsWith('.TWO'))return symbol.slice(0,-4)+':TPEx';const exchange=String(item.exchange||'US').replace('NASDAQ/NYSE','US');return symbol+':'+exchange;}
  async function searchFrom(inputId, resultsId){const keyword=byId(inputId).value.trim();if(!keyword)return;const box=byId(resultsId);box.classList.remove('hidden');box.textContent='搜尋中…';try{const response=await fetch('/api/search?keyword='+encodeURIComponent(keyword));const data=await response.json();box.replaceChildren();(data.results||[]).slice(0,15).forEach(item=>{const row=document.createElement('div');row.className='result';row.textContent=`${compactSymbol(item)} · ${item.name||''}`;row.onclick=()=>{box.classList.add('hidden');openAnalysis(item.symbol);};box.append(row);});if(!box.children.length)box.textContent='找不到商品';}catch(error){box.textContent='搜尋暫時失敗';}}
  const search=()=>searchFrom('search-input','results');
  const searchAnalysis=()=>searchFrom('analysis-search-input','analysis-results');
  const HISTORY_KEY='strategy_signal_history_v1';
  const readHistory=()=>{try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');}catch{return [];}};
  const writeHistory=items=>localStorage.setItem(HISTORY_KEY,JSON.stringify(items.slice(-60)));
  function evaluateHistory(chartData,symbol,interval){const history=readHistory();history.forEach(item=>{if(item.status!=='OPEN'||item.symbol!==symbol||item.interval!==interval)return;const future=chartData.filter(c=>c.time>item.signalTime);for(const candle of future){const hitSl=item.direction==='BUY'?candle.low<=item.sl:candle.high>=item.sl;const hitTp2=item.direction==='BUY'?candle.high>=item.tp2:candle.low<=item.tp2;const hitTp1=item.direction==='BUY'?candle.high>=item.tp1:candle.low<=item.tp1;if(hitSl){item.status='SL';item.closedTime=candle.time;break;}if(hitTp2){item.status='TP2';item.closedTime=candle.time;break;}if(hitTp1){item.status='TP1';item.closedTime=candle.time;break;}}});writeHistory(history);}
  function saveSignal(data,symbol,interval){if(!['BUY','SELL'].includes(data.direction))return;const signalTime=lastChartData.at(-1)?.time;if(!signalTime)return;const history=readHistory();const key=`${symbol}|${interval}|${data.direction}|${signalTime}`;if(history.some(item=>item.key===key))return;history.push({key,symbol,interval,direction:data.direction,entry:Number(data.current_price),sl:Number(data.sl),tp1:Number(data.tp),tp2:Number(data.tp2),signalTime,status:'OPEN',createdAt:Date.now()});writeHistory(history);}
  function renderHistory(){const box=byId('signal-history');const history=readHistory().filter(item=>item.symbol===activeSymbol).slice(-12).reverse();box.replaceChildren();if(!history.length){box.innerHTML='<div class="empty">尚無訊號紀錄</div>';return;}const labels={OPEN:'進行中',TP1:'止盈 1',TP2:'止盈 2',SL:'止損'};history.forEach(item=>{const row=document.createElement('div');row.className='history-item '+item.status;row.textContent=`${item.interval} · ${item.direction==='BUY'?'多':'空'} · 進場 ${item.entry} · ${labels[item.status]}`;box.append(row);});}
  function renderTradePlan(data){const active=['BUY','SELL'].includes(data.direction);byId('trade-plan').classList.toggle('hidden',!active);if(!active)return;byId('entry-price').textContent=data.current_price;byId('stop-price').textContent=data.sl;byId('tp1-price').textContent=data.tp;byId('tp2-price').textContent=data.tp2;}
  async function openAnalysis(symbol){activeSymbol=symbol;byId('home-page').classList.add('hidden');byId('analysis-page').classList.remove('hidden');byId('analysis-results').classList.add('hidden');chart.applyOptions({width:byId('chart').clientWidth});byId('chart-title').textContent=symbol;byId('analysis-error').textContent='';const signal=byId('signal');signal.className='signal HOLD';signal.textContent='資料載入中…';try{const intervalValue=byId('interval').value;const response=await fetch('/api/analyze?symbol='+encodeURIComponent(symbol)+'&interval='+intervalValue);const data=await response.json();if(!response.ok)throw new Error(data.detail||'分析失敗');lastChartData=data.chart_data||[];evaluateHistory(lastChartData,symbol,intervalValue);volumeByTime=new Map(lastChartData.map(c=>[String(c.time),Number(c.volume)||0]));candles.setData(lastChartData);emaFast.setData(data.ema_data?.fast||[]);emaSlow.setData(data.ema_data?.slow||[]);emaTrend.setData(data.ema_data?.trend||[]);structureData=data.structure;levelsData=data.levels;drawIndicators();chart.timeScale().fitContent();byId('source-status').textContent='資料來源：'+data.market_source;signal.className='signal '+data.direction;signal.textContent=(data.direction==='BUY'?'多頭趨勢｜':data.direction==='SELL'?'空頭趨勢｜':'趨勢不明｜')+data.message;byId('reason').textContent=data.reason;renderTradePlan(data);saveSignal(data,symbol,intervalValue);renderHistory();}catch(error){signal.className='signal HOLD';signal.textContent='無法生成圖表';byId('trade-plan').classList.add('hidden');byId('analysis-error').textContent=error.message;renderHistory();}}

  byId('search-button').onclick=search; byId('search-input').onkeydown=e=>{if(e.key==='Enter')search();};byId('analysis-search-button').onclick=searchAnalysis;byId('analysis-search-input').onkeydown=e=>{if(e.key==='Enter')searchAnalysis();}; byId('market-select').onchange=loadRankings; byId('ranking-select').onchange=loadRankings; byId('back-button').onclick=()=>{byId('analysis-page').classList.add('hidden');byId('home-page').classList.remove('hidden');}; byId('interval').onchange=()=>activeSymbol&&openAnalysis(activeSymbol); ['toggle-ema','toggle-levels','toggle-choch','toggle-fvg','toggle-volume'].forEach(id=>byId(id).onchange=drawIndicators);
  new ResizeObserver(entries=>{chart.applyOptions({width:entries[0].contentRect.width});if(volumeChart)volumeChart.applyOptions({width:entries[0].contentRect.width});}).observe(byId('chart'));
  loadRankings();
})();
</script>
</body></html>
