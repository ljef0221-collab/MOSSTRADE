<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融交易導航系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #131722; color: #d1d4dc; display: flex; flex-direction: column; height: 100vh; }
        
        header { background-color: #1e222d; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2e39; }
        .logo { font-size: 1.2rem; font-weight: bold; color: #2962ff; }
        .search-box { display: flex; gap: 8px; }
        input { background: #2a2e39; border: 1px solid #363a45; color: #fff; padding: 8px 12px; border-radius: 4px; outline: none; }
        button { background: #2962ff; border: none; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1e53e5; }

        main { display: flex; flex: 1; overflow: hidden; }
        #chart-container { flex: 3; height: 100%; border-right: 1px solid #2a2e39; }
        #sidebar { flex: 1; min-width: 300px; padding: 20px; background: #1e222d; display: flex; flex-direction: column; gap: 16px; }

        .card { background: #2a2e39; padding: 16px; border-radius: 8px; }
        .card h3 { font-size: 0.9rem; color: #787b86; margin-bottom: 8px; }
        .signal-tag { font-size: 1.5rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .BUY { background: rgba(8, 153, 129, 0.2); color: #089981; }
        .SELL { background: rgba(242, 54, 69, 0.2); color: #f23645; }
        .HOLD { background: rgba(120, 123, 134, 0.2); color: #787b86; }

        .data-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🧭 金融交易導航系統</div>
        <div class="search-box">
            <input type="text" id="symbolInput" placeholder="例如: BINANCE:BTCUSDT 或 AAPL" value="BINANCE:BTCUSDT">
            <button onclick="updateDashboard()">載入數據與策略</button>
        </div>
    </header>

    <main>
        <!-- TradingView 官方 Widget -->
        <div id="chart-container">
            <div id="tradingview_widget" style="height: 100%; width: 100%;"></div>
        </div>

        <!-- 右側策略訊號面板 -->
        <div id="sidebar">
            <div class="card">
                <h3>即時策略分析 (50/200 EMA + ATR)</h3>
                <div id="signalTag" class="signal-tag HOLD">載入中...</div>
                <p id="reasonText" style="margin-top: 8px; font-size: 0.85rem; color: #b2b5be;">正在讀取後端資料...</p>
            </div>

            <div class="card">
                <h3>動態風控參考</h3>
                <div class="data-row"><span>最新成交價:</span> <strong id="closePrice">--</strong></div>
                <div class="data-row"><span>動態停損位 (SL):</span> <strong id="stopLoss" style="color: #f23645;">--</strong></div>
                <div class="data-row"><span>動態停利位 (TP):</span> <strong id="takeProfit" style="color: #089981;">--</strong></div>
                <div class="data-row"><span>14 週期 ATR:</span> <strong id="atrVal">--</strong></div>
            </div>
        </div>
    </main>

    <!-- 載入 TradingView 腳本 -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let tvWidget = null;

        function initTradingView(symbol) {
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Asia/Taipei",
                "theme": "dark",
                "style": "1",
                "locale": "zh_TW",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "container_id": "tradingview_widget"
            });
        }

        async function fetchStrategySignal(rawSymbol) {
            // 解析 TradingView 符號格式 (例如 "BINANCE:BTCUSDT" -> "BTCUSDT")
            const cleanSymbol = rawSymbol.includes(":") ? rawSymbol.split(":")[1] : rawSymbol;
            
            try {
                const response = await fetch(`http://127.0.0.1:8000/api/v1/analyze/${cleanSymbol}`);
                if (!response.ok) throw new Error("API 傳回異常");
                const data = await response.json();

                // 更新前端 UI
                const signalTag = document.getElementById("signalTag");
                signalTag.innerText = data.signal;
                signalTag.className = `signal-tag ${data.signal}`;

                document.getElementById("closePrice").innerText = data.close_price;
                document.getElementById("stopLoss").innerText = data.stop_loss || "--";
                document.getElementById("takeProfit").innerText = data.take_profit || "--";
                document.getElementById("atrVal").innerText = data.atr;
                document.getElementById("reasonText").innerText = data.reason;

            } catch (err) {
                console.error("無法取得後端訊號:", err);
                document.getElementById("signalTag").innerText = "ERROR";
                document.getElementById("reasonText").innerText = "後端 API 連線失敗，請確認 main.py 已啟動。";
            }
        }

        function updateDashboard() {
            const symbol = document.getElementById("symbolInput").value.trim();
            if (symbol) {
                initTradingView(symbol);
                fetchStrategySignal(symbol);
            }
        }

        // 頁面初次載入
        window.onload = () => {
            updateDashboard();
        };
    </script>
</body>
</html>
