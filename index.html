<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartNavigator 市場導航</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
   :root { 
    color-scheme: dark;

    --bg:#000000;
    --panel:#101010;
    --line:#222222;

    --muted:#888888;

    --blue:#00d4ff;
    --green:#00ff88;
    --red:#ff4560;

}
    * { box-sizing:border-box; } body { margin:0; padding:24px; background:var(--bg); color:#f3f5fa; font:14px system-ui,sans-serif; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:20px; } h1 { font-size:22px; margin:0; } .sub { color:var(--muted); margin-top:4px; }
    .search { position:relative; width:min(580px,100%); display:flex; } 
input,select,button {

    font:inherit;

    border-radius:8px;

    border:1px solid #333;

    color:white;

    background:#050505;

    padding:10px 12px;

}
 input { width:100%; } 

button { 
    cursor:pointer;
    background:#001820;
    color:#00d4ff;
    border-color:#00d4ff;
} button:hover { filter:brightness(1.1); }
#search-results {

background:#0a0a0a;

border:1px solid #333;

box-shadow:0 10px 40px #000;

}

 .result { padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line); } 
.result:hover {
    background:#111;
}
 .result small { color:var(--muted); }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:20px; } .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
    .chart-panel { overflow:hidden; } .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:12px; border-bottom:1px solid var(--line); } .toolbar strong { margin-right:auto; } .toolbar select { padding:7px 8px; }
    #chart { height:540px; } .side { display:grid; gap:20px; align-content:start; } .widget { padding:16px; } h2 { font-size:15px; margin:0 0 12px; } .signal { text-align:center; font-weight:700; border-radius:7px; padding:12px; margin:12px 0; } .BUY { background:var(--green); } .SELL { background:var(--red); } .HOLD { background:#596071; }
    .metrics { display:grid; gap:8px; color:var(--muted); } .metrics div { display:flex; justify-content:space-between; } .metrics b { color:#fff; } .reason { color:var(--muted); line-height:1.55; font-size:12px; } .watch { list-style:none; padding:0; margin:0; } .watch li { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; } .watch button { padding:2px 7px; background:transparent; border-color:transparent; color:var(--muted); } .hint { color:var(--muted); font-size:12px; line-height:1.5; }
    @media (max-width:800px) { body { padding:14px; } header { align-items:flex-start; flex-direction:column; } .layout { grid-template-columns:1fr; } #chart { height:420px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>SmartNavigator</h1><div class="sub">市場搜尋、技術策略與時區化圖表 · 瀏覽 <span id="visit-count">—</span> 次</div></div>
    <div class="search"><input id="asset-input" autocomplete="off" placeholder="搜尋商品，例如：台積電、2330.TW、BTC-USD、EURUSD=X"><button id="search-button">搜尋</button><div id="search-results" hidden></div></div>
  </header>
  <main class="layout">
    <section class="panel chart-panel">
      <div class="toolbar"><strong id="chart-title">選擇一個商品開始</strong><select id="interval" aria-label="K 線週期"><optgroup label="分鐘"><option value="1m">1 分鐘</option><option value="3m">3 分鐘</option><option value="5m">5 分鐘</option><option value="10m">10 分鐘</option><option value="15m">15 分鐘</option><option value="30m">30 分鐘</option><option value="45m">45 分鐘</option></optgroup><optgroup label="小時"><option value="1h" selected>1 小時</option><option value="2h">2 小時</option><option value="3h">3 小時</option><option value="4h">4 小時</option></optgroup><optgroup label="長週期"><option value="1d">日線</option><option value="1w">週線</option><option value="1mo">月線</option></optgroup></select><select id="timezone" aria-label="圖表時區"></select></div>
      <div id="chart"></div>
    </section>
    <aside class="side">
<section class="panel widget">

<h2>🧠 AI策略分析</h2>

<h3 id="strategy-name">
等待分析
</h3>

<div class="strategy-tag">
AI策略
</div>

<p id="strategy-description" class="reason">
選擇商品後顯示策略說明
</p>

<div id="signal" class="signal HOLD">
尚未分析
</div>

<div class="metrics"><div>目前價格 <b id="price">—</b></div><div>目標價格 <b id="tp">—</b></div><div>停損價格 <b id="sl">—</b></div></div><p id="reason" class="reason">選擇商品後會依目前的時間週期與策略計算。</p><p class="hint">僅供研究，不構成投資建議。</p></section>
      <section class="panel widget"><h2>自選清單</h2><ul id="watchlist" class="watch"></ul></section>
    </aside>
  </main>
  <script>
    const DEFAULT_WATCHLIST = ['BTC-USD','NVDA','2330.TW','EURUSD=X'];
    let watchlist = JSON.parse(localStorage.getItem('my_watchlist') || 'null') || DEFAULT_WATCHLIST;
    let activeSymbol = '';
    const chart = LightweightCharts.createChart(document.getElementById('chart'), { layout:{background:{color:'#000000'},textColor:'#c9ceda'}, grid:{vertLines:{color:'#202534'},horzLines:{color:'#202534'}}, rightPriceScale:{borderColor:'#303747'}, timeScale:{borderColor:'#303747',timeVisible:true,secondsVisible:false} });
    const series = chart.addSeries(LightweightCharts.CandlestickSeries, {upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
    const input = document.getElementById('asset-input'), results = document.getElementById('search-results');
    let searchTimer;
    function populateTimezones() { const select=document.getElementById('timezone'); const zones=typeof Intl.supportedValuesOf==='function' ? Intl.supportedValuesOf('timeZone') : ['UTC','Asia/Taipei','Asia/Tokyo','America/New_York','Europe/London']; ['UTC',...zones.filter(zone=>zone!=='UTC')].forEach(zone=>{const option=document.createElement('option'); option.value=zone; option.textContent=zone; if(zone==='Asia/Taipei') option.selected=true; select.append(option);}); }
    function timeFormatter(timestamp) { return new Intl.DateTimeFormat('zh-TW',{timeZone:document.getElementById('timezone').value,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(timestamp * 1000)); }
    function applyTimezone() { chart.applyOptions({localization:{timeFormatter}}); }
    new ResizeObserver(entries => { chart.applyOptions({width:entries[0].contentRect.width}); }).observe(document.getElementById('chart'));
    function renderWatchlist() { const list=document.getElementById('watchlist'); list.replaceChildren(); watchlist.forEach(symbol => { const li=document.createElement('li'), label=document.createElement('span'), remove=document.createElement('button'); label.textContent=symbol; label.onclick=()=>analyze(symbol); remove.textContent='×'; remove.title='移除'; remove.onclick=e=>{e.stopPropagation(); watchlist=watchlist.filter(item=>item!==symbol); localStorage.setItem('my_watchlist',JSON.stringify(watchlist)); renderWatchlist();}; li.append(label,remove); list.append(li); }); }
    function showResults(items) { results.replaceChildren(); if (!items.length) { const empty=document.createElement('div'); empty.className='result'; empty.textContent='找不到相符商品'; results.append(empty); } items.forEach(item => { const row=document.createElement('div'), symbol=document.createElement('b'), detail=document.createElement('small'); row.className='result'; symbol.textContent=item.symbol; detail.textContent=`${item.name} · ${item.type}${item.exchange ? ' · '+item.exchange : ''}`; row.append(symbol,document.createElement('br'),detail); row.onclick=()=>{results.hidden=true; input.value=item.symbol; analyze(item.symbol);}; results.append(row); }); results.hidden=false; }
    async function search() { const keyword=input.value.trim(); if (!keyword) return; try { const response=await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`); const data=await response.json(); if (!response.ok) throw new Error(data.detail || '搜尋失敗'); showResults(data.results || []); } catch(error) { showResults([]); } }
    async function analyze(symbol=activeSymbol) { if (!symbol) return; activeSymbol=symbol.toUpperCase(); results.hidden=true; document.getElementById('chart-title').textContent=`${activeSymbol} · 載入中…`; const signal=document.getElementById('signal'); signal.className='signal HOLD'; signal.textContent='正在計算策略…'; try { const params=new URLSearchParams({symbol:activeSymbol,interval:document.getElementById('interval').value}); const response=await fetch(`/api/analyze?${params}`); const data=await response.json(); if (!response.ok) throw new Error(data.detail || '分析失敗'); series.setData(data.chart_data); chart.timeScale().fitContent(); document.getElementById('chart-title').textContent=`${activeSymbol} · ${document.getElementById('interval').selectedOptions[0].text} · ${document.getElementById('timezone').selectedOptions[0].text}`; signal.className=`signal ${data.direction}`; signal.textContent=data.message; document.getElementById('price').textContent=data.current_price; document.getElementById('tp').textContent=data.tp; document.getElementById('sl').textContent=data.sl;
document.getElementById('reason').textContent=data.reason;
 
document.getElementById('strategy-name').textContent=data.strategy_name;

document.getElementById('strategy-description').textContent=data.strategy_description;

} 

catch(error) { document.getElementById('chart-title').textContent=activeSymbol; signal.className='signal HOLD'; signal.textContent=error.message; } }
    async function loadVisitCount() { try { const response=await fetch('/api/stats'); const data=await response.json(); document.getElementById('visit-count').textContent=Number(data.visits).toLocaleString('zh-TW'); } catch { document.getElementById('visit-count').textContent='—'; } }
input.addEventListener('input',()=>{

clearTimeout(searchTimer);

if(input.value.trim().length < 2){
    results.hidden=true;
    return;
}

searchTimer=setTimeout(search,80);

});
input.addEventListener('keydown',event=>{if(event.key==='Enter') search();}); document.getElementById('search-button').onclick=search; document.getElementById('interval').onchange=()=>analyze(); document.getElementById('timezone').onchange=()=>{applyTimezone(); analyze();}; document.addEventListener('click',event=>{if(!event.target.closest('.search')) results.hidden=true;}); populateTimezones(); applyTimezone(); renderWatchlist(); loadVisitCount();
  </script>
</body>
</html>
