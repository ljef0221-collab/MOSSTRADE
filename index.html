<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script><style>body{margin:0;background:#090c12;color:#eee;font:14px Arial;padding:18px}.hide{display:none}.box{background:#121722;border:1px solid #293244;border-radius:10px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{padding:8px;border-bottom:1px solid #293244;cursor:pointer}.up{color:#26a69a}.down{color:#ef5350}input,button,select{padding:10px;background:#151c28;color:#fff;border:1px solid #39465c;border-radius:6px}input{width:min(600px,70%)}#chart{height:450px}#volume{height:130px}@media(max-width:700px){.grid{grid-template-columns:1fr}#chart{height:330px}input{width:70%}}</style></head><body>
<h1>SmartNavigator</h1><section id="home"><h2>Market Overview</h2><input id="q" placeholder="Search: 2330.TW, AAPL, NVDA, GLD, BTC-USDT"><button id="go">Search</button><div id="results" class="box hide"></div><p><select id="market"><option value="futures">Contracts (OKX)</option><option value="taiwan">Taiwan Stocks</option><option value="us">US Stocks / ETFs / Bonds</option><option value="metals">Precious Metals</option></select></p><div class="grid"><div class="box"><b>Gainers Top 10</b><div id="gain"></div></div><div class="box"><b>Losers Top 10</b><div id="lose"></div></div><div class="box"><b>Volume Top 10</b><div id="vol"></div></div></div></section>
<section id="analysis" class="hide"><button id="back">Back</button><span id="src"></span><div class="box"><b id="title"></b><p><select id="interval"><option>1m</option><option>5m</option><option selected>1h</option><option>4h</option><option>1d</option></select><label><input id="ema" type="checkbox"> EMA</label><label><input id="level" type="checkbox"> Support/Resistance</label><label><input id="choch" type="checkbox"> CHoCH</label><label><input id="fvg" type="checkbox"> FVG</label><label><input id="volume-toggle" type="checkbox"> Volume</label></p><div id="chart"></div><div id="volume" class="hide"></div></div><div class="box"><b id="signal">Loading</b><p id="reason"></p></div></section>
<script>
let sym='',rank={},structure,levels,chochLines=[],fvgLines=[],levelLines=[];const C=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#121722'},textColor:'#ddd'},width:document.getElementById('chart').clientWidth,height:450,timeScale:{timeVisible:true}}),V=LightweightCharts.createChart(document.getElementById('volume'),{layout:{background:{color:'#121722'},textColor:'#ddd'},width:document.getElementById('chart').clientWidth,height:130,timeScale:{visible:false}}),S=C.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#26a69a',downColor:'#ef5350'}),VS=V.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'}}),E1=C.addSeries(LightweightCharts.LineSeries,{color:'#f0b90b'}),E2=C.addSeries(LightweightCharts.LineSeries,{color:'#00d4ff'}),E3=C.addSeries(LightweightCharts.LineSeries,{color:'#a78bfa'});function rm(a){a.forEach(x=>S.removePriceLine(x));return []}function paint(){E1.applyOptions({visible:ema.checked});E2.applyOptions({visible:ema.checked});E3.applyOptions({visible:ema.checked});chochLines=rm(chochLines);fvgLines=rm(fvgLines);levelLines=rm(levelLines);if(choch.checked&&structure&&structure.choch){let b=structure.choch.direction==='bullish';chochLines.push(S.createPriceLine({price:structure.choch.level,color:b?'#00d4ff':'#ff4560',lineWidth:2,title:'CHoCH'}))}if(fvg.checked&&structure)(structure.fvg_zones||[]).forEach(z=>{let c=z.side==='bullish'?'#b56cff':'#ff9f43';fvgLines.push(S.createPriceLine({price:z.low,color:c,lineStyle:2,title:'FVG'}),S.createPriceLine({price:z.high,color:c,lineStyle:2,title:'FVG'}))});if(level.checked&&levels)levelLines.push(S.createPriceLine({price:levels.resistance,color:'#f59e0b',title:'R'}),S.createPriceLine({price:levels.support,color:'#26a69a',title:'S'}));volume.className=volume-toggle.checked?'':'hide'}async function openIt(x){sym=x;home.className='hide';analysis.className='';title.textContent=x;try{let d=await fetch('/api/analyze?symbol='+encodeURIComponent(x)+'&interval='+interval.value).then(r=>r.json());if(d.detail)throw Error(d.detail);S.setData(d.chart_data);VS.setData(d.chart_data.map(c=>({time:c.time,value:c.volume||0,color:c.close>=c.open?'#26a69a':'#ef5350'})));E1.setData(d.ema_data.fast);E2.setData(d.ema_data.slow);E3.setData(d.ema_data.trend);structure=d.structure;levels=d.levels;src.textContent=d.market_source;signal.textContent=d.message;reason.textContent=d.reason;paint();C.timeScale().fitContent()}catch(e){signal.textContent=e.message}}function rows(id,a,kind){let b=document.getElementById(id);b.innerHTML='';a.forEach((x,i)=>{let d=document.createElement('div');d.className='row '+(x.change>=0?'up':'down');d.textContent=(i+1)+'. '+x.name+' '+(kind==='v'?(x.volume/1e6).toFixed(1)+'M':x.change+'%');d.onclick=()=>openIt(x.symbol);b.append(d)})}function render(){let d=rank[market.value]||{};rows('gain',d.gainers||[]);rows('lose',d.losers||[]);rows('vol',d.volume||[],'v')}async function loadRank(){let d=await fetch('/api/market-rankings').then(r=>r.json());rank=d.markets||{};render()}async function find(){let d=await fetch('/api/search?keyword='+encodeURIComponent(q.value)).then(r=>r.json()),b=results;b.innerHTML='';(d.results||[]).forEach(x=>{let e=document.createElement('div');e.className='row';e.textContent=x.symbol+' '+x.name;e.onclick=()=>openIt(x.symbol);b.append(e)});b.className='box'}go.onclick=find;q.onkeydown=e=>{if(e.key==='Enter')find()};market.onchange=render;back.onclick=()=>{analysis.className='hide';home.className=''};interval.onchange=()=>openIt(sym);[ema,level,choch,fvg,volume-toggle].forEach(x=>x.onchange=paint);new ResizeObserver(x=>{C.applyOptions({width:x[0].contentRect.width});V.applyOptions({width:x[0].contentRect.width})}).observe(chart);loadRank();
</script><script>
const volumeToggle=document.getElementById('volume-toggle');
window.paint=function(){E1.applyOptions({visible:ema.checked});E2.applyOptions({visible:ema.checked});E3.applyOptions({visible:ema.checked});chochLines=rm(chochLines);fvgLines=rm(fvgLines);levelLines=rm(levelLines);if(choch.checked&&structure&&structure.choch){const b=structure.choch.direction==='bullish';chochLines.push(S.createPriceLine({price:structure.choch.level,color:b?'#00d4ff':'#ff4560',lineWidth:2,title:'CHoCH'}));}if(fvg.checked&&structure){(structure.fvg_zones||[]).forEach(z=>{const c=z.side==='bullish'?'#b56cff':'#ff9f43';fvgLines.push(S.createPriceLine({price:z.low,color:c,lineStyle:2,title:'FVG'}),S.createPriceLine({price:z.high,color:c,lineStyle:2,title:'FVG'}));});}if(level.checked&&levels){levelLines.push(S.createPriceLine({price:levels.resistance,color:'#f59e0b',title:'R'}),S.createPriceLine({price:levels.support,color:'#26a69a',title:'S'}));}volume.className=volumeToggle.checked?'':'hide';};[ema,level,choch,fvg,volumeToggle].forEach(x=>x.onchange=window.paint);loadRank();
</script></body></html>
