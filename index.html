<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNavigator - 市場監測與交易輔助平台</title>
    <!-- 引入 Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121420; color: #d1d4dc; }
        
        /* 導覽列 */
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #1e222d; border-bottom: 1px solid #2a2e39; }
        .logo { font-size: 20px; font-weight: bold; color: #2962ff; cursor: pointer; }
        .nav-tools { display: flex; gap: 12px; }
        .btn { background: #2962ff; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #1e4bd8; }
        
        /* 搜尋區塊 */
        .search-container { max-width: 800px; margin: 30px auto; padding: 0 20px; text-align: center; }
        .search-box { width: 100%; padding: 16px 20px; font-size: 18px; border-radius: 30px; border: 2px solid #2a2e39; background: #1e222d; color: #fff; outline: none; transition: border-color 0.2s; }
        .search-box:focus { border-color: #2962ff; }
        
        /* 首頁 DashBoard (榜單視圖) */
        #dashboard-section { max-width: 1200px; margin: 0 auto; padding: 0 20px 40px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
        
        .card { background: #1e222d; border-radius: 8px; padding: 20px; border: 1px solid #2a2e39; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        
        .rank-table { width: 100%; border-collapse: collapse; }
        .rank-table th, .rank-table td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2e39; }
        .rank-table th { color: #787b86; font-size: 13px; }
        .rank-table tr { cursor: pointer; transition: background 0.15s; }
        .rank-table tbody tr:hover { background: #2a2e39; }
        
        .up { color: #089981; font-weight: bold; }
        .down { color: #f23645; font-weight: bold; }
        
        /* 分析頁面 (K線圖視圖) - 預設 display: none */
        #chart-section { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        #chart-title { font-size: 24px; font-weight: bold; color: #fff; }
        #tv-chart { width: 100%; height: 650px; background: #1e222d; border-radius: 8px; border: 1px solid #2a2e39; }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header>
        <div class="logo" onclick="showDashboard()">SmartNavigator</div>
        <div class="nav-tools">
            <button id="home-btn" class="btn" onclick="showDashboard()">🏠 首頁</button>
        </div>
    </header>

    <!-- 1. 首頁 (Dashboard) 區塊 -->
    <div id="dashboard-section">
        <!-- 放大版搜尋框 -->
        <div class="search-container">
            <input type="text" id="symbol-search" class="search-box" placeholder="輸入美股/加密貨幣代號 (例如: NVDA, TSLA, BTC-USD) 按 Enter 分析..." onkeydown="handleSearch(event)">
        </div>

        <!-- 雙榜單 -->
        <div class="grid-container">
            <!-- 成交量榜單 -->
            <div class="card">
                <div class="card-title">🔥 成交量前 5 名</div>
                <table class="rank-table">
                    <thead>
                        <tr><th>代碼</th><th>最新價</th><th>成交量</th></tr>
                    </thead>
                    <tbody id="volume-list">
                        <tr><td colspan="3" style="text-align:center; color:#787b86;">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 漲跌幅榜單 -->
            <div class="card">
                <div class="card-title">⚡ 漲跌幅前 5 名</div>
                <table class="rank-table">
                    <thead>
                        <tr><th>代碼</th><th>最新價</th><th>漲跌幅</th></tr>
                    </thead>
                    <tbody id="gainer-list">
                        <tr><td colspan="3" style="text-align:center; color:#787b86;">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 2. K線分析區塊 (預設完全不佔用空間) -->
    <div id="chart-section">
        <div class="chart-header">
            <h2 id="chart-title">NVDA - K線圖分析</h2>
            <button class="btn" onclick="showDashboard()">返回榜單</button>
        </div>
        <div id="tv-chart"></div>
    </div>

    <script>
        let chart = null;
        let candlestickSeries = null;

        // 初始化載入
        document.addEventListener('DOMContentLoaded', () => {
            fetchRankings();
        });

        // 頁面切換：顯示首頁榜單
        function showDashboard() {
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('chart-section').style.display = 'none';
        }

        // 頁面切換：顯示圖表頁面
        function showChartSection(symbol) {
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('chart-section').style.display = 'block';
            document.getElementById('chart-title').innerText = `${symbol} - K線圖分析`;
            
            // 延遲繪製圖表以確保 DOM 已獲得正確寬高
            setTimeout(() => {
                initChart();
                loadSymbolData(symbol);
            }, 50);
        }

        // 搜尋事件
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const symbol = event.target.value.trim().toUpperCase();
                if (symbol) {
                    showChartSection(symbol);
                }
            }
        }

        // 抓取全市場動態榜單
        async function fetchRankings() {
            try {
                const res = await fetch('/api/rankings');
                const data = await res.json();
                
                renderTable('volume-list', data.top_volume, item => `
                    <tr onclick="showChartSection('${item.symbol}')">
                        <td><strong>${item.symbol}</strong></td>
                        <td>$${item.price}</td>
                        <td>${(item.volume / 1e6).toFixed(2)}M</td>
                    </tr>
                `);

                renderTable('gainer-list', data.top_gainers, item => {
                    const changeClass = item.change >= 0 ? 'up' : 'down';
                    const changeSign = item.change >= 0 ? '+' : '';
                    return `
                        <tr onclick="showChartSection('${item.symbol}')">
                            <td><strong>${item.symbol}</strong></td>
                            <td>$${item.price}</td>
                            <td class="${changeClass}">${changeSign}${item.change}%</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("無法載入榜單資料:", err);
            }
        }

        function renderTable(elementId, items, rowTemplate) {
            const container = document.getElementById(elementId);
            if (!items || items.length === 0) {
                container.innerHTML = '<tr><td colspan="3" style="text-align:center;">無資料</td></tr>';
                return;
            }
            container.innerHTML = items.map(rowTemplate).join('');
        }

        // 初始化 TradingView 圖表
        function initChart() {
            const container = document.getElementById('tv-chart');
            container.innerHTML = ''; // 清空既有圖表

            chart = LightweightCharts.createChart(container, {
                layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
                timeScale: { borderColor: '#2a2e39', timeVisible: true },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981', downColor: '#f23645',
                borderUpColor: '#089981', borderDownColor: '#f23645',
                wickUpColor: '#089981', wickDownColor: '#f23645',
            });
        }

        // 相容性設定 Markers（解決 series.setMarkers is not a function 報錯）
        function setSeriesMarkers(series, markers) {
            if (typeof series.setMarkers === 'function') {
                // 舊版 lightweight-charts 語法
                series.setMarkers(markers);
            } else if (typeof LightweightCharts.createSeriesMarker === 'function') {
                // 新版 lightweight-charts 語法
                LightweightCharts.createSeriesMarker(series, markers);
            } else {
                console.warn("目前版本的 LightweightCharts 找不到相容的 setMarkers API");
            }
        }

        // 載入標的 K 線與 SMC 訊號數據
        async function loadSymbolData(symbol) {
            try {
                const res = await fetch(`/api/klines?symbol=${symbol}`);
                const data = await res.json();
                
                if (data && data.ohlc) {
                    candlestickSeries.setData(data.ohlc);
                    
                    // 繪製 SMC/ICT 買賣與 FVG 標記點 (如果有 signals)
                    if (data.signals) {
                        setSeriesMarkers(candlestickSeries, data.signals);
                    }
                }
            } catch (err) {
                console.error("載入 K 線數據失敗:", err);
            }
        }
    </script>
</body>
</html>
