<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartNavigator 市場導航</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root { 
      color-scheme: dark;
      --bg:#000000;
      --panel:#101010;
      --line:#222222;
      --muted:#888888;
      --blue:#00d4ff;
      --green:#00ff88;
      --red:#ff4560;
    }
    * { box-sizing:border-box; } 
    body { margin:0; padding:24px; background:var(--bg); color:#f3f5fa; font:14px system-ui,sans-serif; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:20px; } 
    h1 { font-size:22px; margin:0; } 
    .sub { color:var(--muted); margin-top:4px; }
    .header-actions { display:flex; gap:10px; align-items:center; }
    .search { position:relative; width:min(580px,100%); }
    .search-shell { display:flex; align-items:center; gap:8px; background:#101010; border:1px solid #303030; border-radius:10px; padding:4px 6px 4px 12px; }
    .search-icon { color:var(--muted); font-size:16px; }
    input,select,button { font:inherit; border-radius:8px; border:1px solid #333; color:white; background:#050505; padding:10px 12px; }
    .search input { border:0; outline:0; background:transparent; padding:8px 2px; }
    .search-button, .home-button { cursor:pointer; background:#1b1b1b; color:#e7e7e7; border-color:#3a3a3a; }
    .search-button:hover, .home-button:hover { background:#282828; border-color:#5a5a5a; }
    #search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 100;
      background:#0a0a0a;
      border:1px solid #333;
      border-radius: 8px;
      margin-top: 4px;
      max-height: 360px;
      overflow-y: auto;
      box-shadow:0 10px 40px #000;
    }
    .result-heading { padding:9px 12px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
    .result { padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line); } 
    .result:hover { background:#111; }
    .result small { color:var(--muted); }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:20px; } 
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
    .chart-panel { overflow:hidden; } 
    .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:12px; border-bottom:1px solid var(--line); } 
    .toolbar strong { margin-right:auto; } 
    .toolbar select { padding:7px 8px; }
    .tool-button, .drawing-select { cursor:pointer; padding:7px 9px; background:#181818; color:#d7d7d7; border-color:#3a3a3a; }
    .toggle { display:flex; align-items:center; gap:4px; color:#bfc5cf; font-size:12px; white-space:nowrap; }
    .toggle input { accent-color:#00d4ff; padding:0; }
    #source-status { color:#b8e7ce; font-size:12px; white-space:nowrap; }
    #chart { height:540px; } 
    .side { display:grid; gap:20px; align-content:start; } 
    .widget { padding:16px; } 
    h2 { font-size:15px; margin:0 0 12px; } 
    .signal { text-align:center; font-weight:700; border-radius:7px; padding:12px; margin:12px 0; } 
    .BUY { background:var(--green); color:#000; } 
    .SELL { background:var(--red); color:#fff; } 
    .HOLD { background:#333333; color:#aaa; }
    .metrics { display:grid; gap:8px; color:var(--muted); } 
    .metrics div { display:flex; justify-content:space-between; } 
    .metrics b { color:#fff; } 
    .reason { color:var(--muted); line-height:1.55; font-size:12px; } 
    .watch { list-style:none; padding:0; margin:0; } 
    .watch li { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; } 
    .watch button { padding:2px 7px; background:transparent; border-color:transparent; color:var(--muted); } 
    .hint { color:var(--muted); font-size:12px; line-height:1.5; }
    #structure-note { margin:12px 0 0; color:var(--muted); font-size:12px; line-height:1.55; }
    @media (max-width:800px) { 
      body { padding:14px; } 
      header { align-items:flex-start; flex-direction:column; } 
      .layout { grid-template-columns:1fr; } 
      #chart { height:420px; } 
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>SmartNavigator</h1>
      <div class="sub">市場搜尋、技術策略與時區化圖表 · 瀏覽 <span id="visit-count">—</span> 次</div>
    </div>
    <div class="header-actions">
      <button id="home-button" class="home-button" type="button">首頁</button>
      <div class="search">
        <div class="search-shell">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="asset-input" autocomplete="off" placeholder="搜尋商品、代號或市場">
          <button id="search-button" class="search-button" type="button">搜尋</button>
        </div>
        <div id="search-results" hidden></div>
      </div>
    </div>
  </header>
  
  <main class="layout">
    <section class="panel chart-panel">
      <div class="toolbar">
        <strong id="chart-title">選擇一個商品開始</strong>
        <select id="exchange-source" aria-label="合約交易所"><option value="OKX">OKX 永續合約</option></select>
        <span id="source-status">資料來源：OKX 永續合約</span>
        <select id="interval" aria-label="K 線週期">
          <optgroup label="分鐘">
            <option value="1m">1 分鐘</option>
            <option value="3m">3 分鐘</option>
            <option value="5m">5 分鐘</option>
            <option value="10m">10 分鐘</option>
            <option value="15m">15 分鐘</option>
            <option value="30m">30 分鐘</option>
            <option value="45m">45 分鐘</option>
          </optgroup>
          <optgroup label="小時">
            <option value="1h" selected>1 小時</option>
            <option value="2h">2 小時</option>
            <option value="3h">3 小時</option>
            <option value="4h">4 小時</option>
          </optgroup>
          <optgroup label="長週期">
            <option value="1d">日線</option>
            <option value="1w">週線</option>
            <option value="1mo">月線</option>
          </optgroup>
        </select>
        <select id="timezone" aria-label="圖表時區"></select>
        <select id="drawing-tool" class="drawing-select" aria-label="繪圖工具">
          <option value="none">繪圖工具</option>
          <option value="line">水平線</option>
        </select>
        <button id="undo-line" class="tool-button" type="button">返回上一步</button>
        <button id="clear-lines" class="tool-button" type="button">清除線條</button>
        <label class="toggle"><input id="toggle-ema" type="checkbox" checked> EMA</label>
        <label class="toggle"><input id="toggle-levels" type="checkbox" checked> 撐壓</label>
        <label class="toggle"><input id="toggle-structure" type="checkbox" checked> CHoCH / FVG</label>
      </div>
      <div id="chart"></div>
    </section>
    
    <aside class="side">
      <section class="panel widget">
        <h2>🧠 AI策略分析</h2>
        <h3 id="strategy-name">等待分析</h3>
        <p id="strategy-description" class="reason">選擇商品後顯示策略說明</p>
        <div id="signal" class="signal HOLD">尚未分析</div>
        <div class="metrics">
          <div>目前價格 <b id="price">—</b></div>
          <div>目標價格 <b id="tp">—</b></div>
          <div>停損價格 <b id="sl">—</b></div>
        </div>
        <p id="reason" class="reason">選擇商品後會依目前的時間週期與策略計算。</p>
        <p id="structure-note">CHoCH：結構轉變；FVG：價格失衡區。</p>
        <p class="hint">僅供研究，不構成投資建議。</p>
      </section>

      <section class="panel widget">
        <h2>自選清單</h2>
        <ul id="watchlist" class="watch"></ul>
      </section>
    </aside>
  </main>

  <script>
    const DEFAULT_WATCHLIST = ['OKX:BTC-USDT-SWAP', 'OKX:ETH-USDT-SWAP', 'NVDA', '2330.TW'];
    let watchlist = JSON.parse(localStorage.getItem('my_watchlist') || 'null') || DEFAULT_WATCHLIST;
    watchlist = watchlist.map(symbol => symbol.startsWith('BINANCE:') || symbol.startsWith('BYBIT:') ? `OKX:${symbol.split(':')[1].replace('USDT', '-USDT-SWAP')}` : symbol);
    localStorage.setItem('my_watchlist', JSON.stringify(watchlist));
    let activeSymbol = '';

    // 初始化 Lightweight Chart
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { background: { color: '#000000' }, textColor: '#c9ceda' },
      grid: { vertLines: { color: '#202534' }, horzLines: { color: '#202534' } },
      rightPriceScale: { borderColor: '#303747' },
      timeScale: { borderColor: '#303747', timeVisible: true, secondsVisible: false }
    });
    
    const series = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
    });
    const emaFastSeries = chart.addSeries(LightweightCharts.LineSeries, { color:'#f0b90b', lineWidth:1, title:'EMA Fast', lastValueVisible:false, priceLineVisible:false });
    const emaSlowSeries = chart.addSeries(LightweightCharts.LineSeries, { color:'#00d4ff', lineWidth:1, title:'EMA Slow', lastValueVisible:false, priceLineVisible:false });
    const emaTrendSeries = chart.addSeries(LightweightCharts.LineSeries, { color:'#a78bfa', lineWidth:1, title:'EMA Trend', lastValueVisible:false, priceLineVisible:false });
    let markerPlugin = null;
    let fvgLines = [];
    let chochLines = [];
    let srLines = [];
    let latestStructure = null;
    let latestLevels = null;
    let userLines = [];
    let structureMarkers = [];
    let userMarkers = [];

    const input = document.getElementById('asset-input');
    const results = document.getElementById('search-results');
    let searchTimer;

    // 取得訪問次數
    async function loadVisitCount() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('visit-count').textContent = data.visits || 0;
      } catch (e) {
        console.error('無法取得瀏覽次數', e);
      }
    }

    function populateTimezones() {
      const select = document.getElementById('timezone');
      const zones = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : ['UTC', 'Asia/Taipei', 'Asia/Tokyo', 'America/New_York', 'Europe/London'];
      ['UTC', ...zones.filter(zone => zone !== 'UTC')].forEach(zone => {
        const option = document.createElement('option');
        option.value = zone;
        option.textContent = zone;
        if (zone === 'Asia/Taipei') option.selected = true;
        select.append(option);
      });
    }

    function timeFormatter(timestamp) {
      return new Intl.DateTimeFormat('zh-TW', {
        timeZone: document.getElementById('timezone').value,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(new Date(timestamp * 1000));
    }

    function applyTimezone() {
      chart.applyOptions({ localization: { timeFormatter } });
    }

    function updateMarkers() {
      const markers = [...(document.getElementById('toggle-structure').checked ? structureMarkers : []), ...userMarkers].sort((a, b) => a.time - b.time);
      if (typeof LightweightCharts.createSeriesMarkers === 'function') {
        markerPlugin ??= LightweightCharts.createSeriesMarkers(series, []);
        markerPlugin.setMarkers(markers);
      } else if (typeof series.setMarkers === 'function') {
        series.setMarkers(markers);
      }
    }

    function renderStructure(structure) {
      latestStructure = structure;
      structureMarkers = structure?.markers || [];
      const zones = structure?.fvg_zones || [];
      updateMarkers();
      fvgLines.forEach(line => series.removePriceLine(line));
      chochLines.forEach(line => series.removePriceLine(line));
      fvgLines = [];
      chochLines = [];
      if (!document.getElementById('toggle-structure').checked) return;
      zones.forEach(zone => {
        const color = zone.side === 'bullish' ? '#26a69a' : '#ef5350';
        fvgLines.push(series.createPriceLine({ price: zone.low, color, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: `FVG ${zone.side}` }));
        fvgLines.push(series.createPriceLine({ price: zone.high, color, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: `FVG ${zone.side}` }));
      });
      if (structure?.choch) {
        const bullish = structure.choch.direction === 'bullish';
        chochLines.push(series.createPriceLine({ price: structure.choch.level, color: bullish ? '#26a69a' : '#ef5350', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: bullish ? 'Bullish CHoCH' : 'Bearish CHoCH' }));
      }
      const choch = structureMarkers.length ? structureMarkers[0].text : '尚未確認結構轉變';
      const fvg = zones.length ? `偵測到 ${zones.length} 個 FVG 價格失衡區` : '尚未偵測到 FVG';
      document.getElementById('structure-note').textContent = `CHoCH：結構轉變（${choch}）。FVG：價格失衡區（${fvg}）。`;
    }

    chart.subscribeClick(param => {
      const tool = document.getElementById('drawing-tool').value;
      if (tool === 'none' || !param.point) return;
      if (tool === 'line') {
        const price = series.coordinateToPrice(param.point.y);
        if (price != null) userLines.push(series.createPriceLine({ price, color: '#d1d4dc', lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: '手動畫線' }));
        return;
      }
      const time = chart.timeScale().coordinateToTime(param.point.x);
      if (typeof time !== 'number') return;
      userMarkers.push({ time, position: tool === 'arrow-up' ? 'belowBar' : 'aboveBar', color: tool === 'arrow-up' ? '#26a69a' : '#ef5350', shape: tool === 'arrow-up' ? 'arrowUp' : 'arrowDown', text: tool === 'arrow-up' ? '手動 ↑' : '手動 ↓' });
      updateMarkers();
    });

    new ResizeObserver(entries => {
      chart.applyOptions({ width: entries[0].contentRect.width });
    }).observe(document.getElementById('chart'));

    function renderLevels(levels) {
      latestLevels = levels;
      srLines.forEach(line => series.removePriceLine(line));
      srLines = [];
      if (!levels || !document.getElementById('toggle-levels').checked) return;
      srLines.push(series.createPriceLine({ price: levels.resistance, color:'#f59e0b', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'Resistance' }));
      srLines.push(series.createPriceLine({ price: levels.support, color:'#26a69a', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'Support' }));
    }

    function applyIndicatorVisibility() {
      const showEma = document.getElementById('toggle-ema').checked;
      emaFastSeries.applyOptions({ visible: showEma });
      emaSlowSeries.applyOptions({ visible: showEma });
      emaTrendSeries.applyOptions({ visible: showEma });
      renderLevels(latestLevels);
      renderStructure(latestStructure);
    }

    function renderWatchlist() {
      const list = document.getElementById('watchlist');
      list.replaceChildren();
      watchlist.forEach(symbol => {
        const li = document.createElement('li');
        const label = document.createElement('span');
        const remove = document.createElement('button');
        label.textContent = symbol;
        label.onclick = () => {
          input.value = symbol;
          analyze(symbol);
        };
        remove.textContent = '×';
        remove.title = '移除';
        remove.onclick = e => {
          e.stopPropagation();
          watchlist = watchlist.filter(item => item !== symbol);
          localStorage.setItem('my_watchlist', JSON.stringify(watchlist));
          renderWatchlist();
        };
        li.append(label, remove);
        list.append(li);
      });
    }

    function showResults(items) {
      results.replaceChildren();
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'result';
        empty.textContent = '找不到相符商品';
        results.append(empty);
        results.hidden = false;
        return;
      }

      const heading = document.createElement('div');
      heading.className = 'result-heading';
      heading.textContent = '建議商品';
      results.append(heading);

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'result';
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.alignItems = 'center';

        const leftContainer = document.createElement('div');
        const symbol = document.createElement('b');
        symbol.textContent = item.symbol;
        symbol.style.color = '#00d4ff';

        const detail = document.createElement('small');
        detail.style.display = 'block';
        detail.textContent = `${item.name || '未知商品'} · ${item.type}${item.exchange ? ' · ' + item.exchange : ''}`;

        leftContainer.append(symbol, detail);

        row.append(leftContainer);
        row.onclick = () => {
          results.hidden = true;
          input.value = item.symbol;
          analyze(item.symbol);
        };
        results.append(row);
      });
      results.hidden = false;
    }

    async function search() {
      const keyword = input.value.trim();
      if (!keyword) return;
      try {
        const response = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '搜尋失敗');
        showResults(data.results || []);
      } catch (error) {
        showResults([]);
      }
    }

    async function analyze(symbol = activeSymbol) {
      if (!symbol) symbol = 'OKX:BTC-USDT-SWAP';
      activeSymbol = symbol.toUpperCase();
      results.hidden = true;

      document.getElementById('chart-title').textContent = `${activeSymbol} · 載入中…`;
      const signal = document.getElementById('signal');
      signal.className = 'signal HOLD';
      signal.textContent = '正在計算策略…';

      try {
        const intervalValue = document.getElementById('interval').value;
        const params = new URLSearchParams({ symbol: activeSymbol, interval: intervalValue });

        const response = await fetch(`/api/analyze?${params}`);
        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || '分析失敗');

        series.setData(data.chart_data);
        emaFastSeries.setData(data.ema_data?.fast || []);
        emaSlowSeries.setData(data.ema_data?.slow || []);
        emaTrendSeries.setData(data.ema_data?.trend || []);
        chart.timeScale().fitContent();
        renderLevels(data.levels);
        renderStructure(data.structure);

        document.getElementById('chart-title').textContent = `${activeSymbol} · ${document.getElementById('interval').selectedOptions[0].text} · ${document.getElementById('timezone').selectedOptions[0].text}`;
        signal.className = `signal ${data.direction}`;
        signal.textContent = data.message;
        document.getElementById('price').textContent = data.current_price;
        document.getElementById('tp').textContent = data.tp;
        document.getElementById('sl').textContent = data.sl;
        document.getElementById('reason').textContent = data.reason;
        document.getElementById('strategy-name').textContent = data.strategy_name;
        document.getElementById('strategy-description').textContent = data.strategy_description;
        document.getElementById('source-status').textContent = `資料來源：${data.market_source}`;
      } catch (error) {
        document.getElementById('chart-title').textContent = activeSymbol;
        signal.className = 'signal HOLD';
        signal.textContent = error.message;
      }
    }

    // 事件監聽與綁定
    input.addEventListener('input', () => {
      clearTimeout(searchTimer);
      if (input.value.trim().length < 2) {
        results.hidden = true;
        return;
      }
      searchTimer = setTimeout(search, 200);
    });

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        clearTimeout(searchTimer);
        search();
      }
    });

    document.getElementById('search-button').onclick = search;
    document.getElementById('clear-lines').onclick = () => {
      userLines.forEach(line => series.removePriceLine(line));
      userLines = [];
      userMarkers = [];
      updateMarkers();
    };
    document.getElementById('undo-line').onclick = () => {
      const lastLine = userLines.pop();
      if (lastLine) series.removePriceLine(lastLine);
    };
    ['toggle-ema', 'toggle-levels', 'toggle-structure'].forEach(id => {
      document.getElementById(id).onchange = applyIndicatorVisibility;
    });
    document.getElementById('home-button').onclick = () => {
      input.value = '';
      results.hidden = true;
      document.getElementById('interval').value = '1h';
      analyze('OKX:BTC-USDT-SWAP');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    document.getElementById('interval').onchange = () => analyze();
    
    document.getElementById('timezone').onchange = () => {
      applyTimezone();
      if (activeSymbol) {
        document.getElementById('chart-title').textContent = `${activeSymbol} · ${document.getElementById('interval').selectedOptions[0].text} · ${document.getElementById('timezone').selectedOptions[0].text}`;
      }
    };

    document.addEventListener('click', event => {
      if (!event.target.closest('.search')) results.hidden = true;
    });

    // 初始化啟動
    populateTimezones();
    applyTimezone();
    renderWatchlist();
    loadVisitCount();
    analyze('OKX:BTC-USDT-SWAP');
  </script>
</body>
</html>
