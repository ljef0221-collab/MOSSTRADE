<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNavigator - 市場監測與交易輔助平台</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121420; color: #d1d4dc; }
        
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #1e222d; border-bottom: 1px solid #2a2e39; }
        .logo { font-size: 20px; font-weight: bold; color: #2962ff; cursor: pointer; }
        .btn { background: #2962ff; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .hidden { display: none !important; }

        #dashboard-section { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .search-container { max-width: 800px; margin: 20px auto 30px; text-align: center; }
        .search-box { width: 100%; padding: 16px 24px; font-size: 18px; border-radius: 30px; border: 2px solid #2a2e39; background: #1e222d; color: #fff; outline: none; }
        .search-box:focus { border-color: #2962ff; }
        
        /* 切換頁籤按鈕 */
        .market-toggle { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .toggle-btn { background: #1e222d; border: 1px solid #2a2e39; color: #787b86; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .toggle-btn.active { background: #2962ff; color: #fff; border-color: #2962ff; }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
        
        .card { background: #1e222d; border-radius: 12px; padding: 20px; border: 1px solid #2a2e39; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #fff; }
        
        .rank-table { width: 100%; border-collapse: collapse; }
        .rank-table th, .rank-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2e39; font-size: 14px; }
        .rank-table th { color: #787b86; font-size: 12px; }
        .rank-table tr { cursor: pointer; transition: background 0.15s; }
        .rank-table tbody tr:hover { background: #2a2e39; }
        
        .up { color: #089981; font-weight: bold; }
        .down { color: #f23645; font-weight: bold; }
        
        #chart-section { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .chart-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .back-btn { background: #2a2e39; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #chart-title { font-size: 24px; font-weight: bold; color: #fff; }
        #tv-chart { width: 100%; height: 700px; background: #1e222d; border-radius: 12px; border: 1px solid #2a2e39; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showDashboard()">SmartNavigator</div>
        <button class="btn" onclick="showDashboard()">🏠 首頁榜單</button>
    </header>

    <!-- 首頁榜單區塊 -->
    <div id="dashboard-section">
        <div class="search-container">
            <input type="text" id="symbol-search" class="search-box" placeholder="搜尋加密貨幣 (如 BTCUSDT, ETHUSDT) 按 Enter 分析..." onkeydown="handleSearch(event)">
        </div>

        <!-- 市場切換 -->
        <div class="market-toggle">
            <button id="btn-futures" class="toggle-btn active" onclick="switchMarket('futures')">⚡ USDT-M 合約</button>
            <button id="btn-spot" class="toggle-btn" onclick="switchMarket('spot')">🛒 現貨市場</button>
        </div>

        <div class="grid-container">
            <div class="card">
                <div class="card-title">🔥 成交量前 10 名</div>
                <table class="rank-table">
                    <thead>
                        <tr><th>#</th><th>標的</th><th>最新價</th><th>成交額</th></tr>
                    </thead>
                    <tbody id="volume-list">
                        <tr><td colspan="4" style="text-align:center;">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <div class="card-title">🚀 漲跌幅前 10 名</div>
                <table class="rank-table">
                    <thead>
                        <tr><th>#</th><th>標的</th><th>最新價</th><th>24h 漲跌</th></tr>
                    </thead>
                    <tbody id="gainer-list">
                        <tr><td colspan="4" style="text-align:center;">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 獨立 K 線分析頁 -->
    <div id="chart-section" class="hidden">
        <div class="chart-nav">
            <button class="back-btn" onclick="showDashboard()">❮ 返回榜單</button>
            <h2 id="chart-title">BTCUSDT - K線分析</h2>
            <div style="width: 80px;"></div>
        </div>
        <div id="tv-chart"></div>
    </div>

    <script>
        let currentMarket = 'futures';
        let chart = null;
        let candlestickSeries = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetchRankings(currentMarket);
        });

        function switchMarket(type) {
            currentMarket = type;
            document.getElementById('btn-futures').classList.toggle('active', type === 'futures');
            document.getElementById('btn-spot').classList.toggle('active', type === 'spot');
            fetchRankings(type);
        }

        function showDashboard() {
            document.getElementById('chart-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        function showChartSection(symbol) {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('chart-section').classList.remove('hidden');
            document.getElementById('chart-title').innerText = `${symbol} - K線圖分析`;
            
            setTimeout(() => {
                initChart();
                loadSymbolData(symbol);
            }, 50);
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                let symbol = event.target.value.trim().toUpperCase();
                if (symbol) {
                    if (!symbol.endsWith('USDT')) symbol += 'USDT';
                    showChartSection(symbol);
                }
            }
        }

        async function fetchRankings(type) {
            try {
                const res = await fetch(`/api/rankings?type=${type}`);
                const data = await res.json();
                
                renderTable('volume-list', data.top_volume, (item, idx) => `
                    <tr onclick="showChartSection('${item.symbol}')">
                        <td style="color:#787b86">${idx + 1}</td>
                        <td><strong>${item.symbol}</strong></td>
                        <td>$${item.price}</td>
                        <td>$${(item.volume / 1e6).toFixed(1)}M</td>
                    </tr>
                `);

                renderTable('gainer-list', data.top_gainers, (item, idx) => {
                    const changeClass = item.change >= 0 ? 'up' : 'down';
                    const changeSign = item.change >= 0 ? '+' : '';
                    return `
                        <tr onclick="showChartSection('${item.symbol}')">
                            <td style="color:#787b86">${idx + 1}</td>
                            <td><strong>${item.symbol}</strong></td>
                            <td>$${item.price}</td>
                            <td class="${changeClass}">${changeSign}${item.change}%</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("載入榜單失敗:", err);
            }
        }

        function renderTable(elementId, items, rowTemplate) {
            const container = document.getElementById(elementId);
            if (!items || items.length === 0) {
                container.innerHTML = '<tr><td colspan="4" style="text-align:center;">無資料</td></tr>';
                return;
            }
            container.innerHTML = items.map((item, idx) => rowTemplate(item, idx)).join('');
        }

        function initChart() {
            const container = document.getElementById('tv-chart');
            container.innerHTML = ''; 

            chart = LightweightCharts.createChart(container, {
                layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
                timeScale: { borderColor: '#2a2e39', timeVisible: true },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981', downColor: '#f23645',
                borderUpColor: '#089981', borderDownColor: '#f23645',
                wickUpColor: '#089981', wickDownColor: '#f23645',
            });
        }

        async function loadSymbolData(symbol) {
            try {
                const res = await fetch(`/api/klines?symbol=${symbol}`);
                const data = await res.json();
                
                if (data && data.ohlc && data.ohlc.length > 0) {
                    candlestickSeries.setData(data.ohlc);
                    
                    if (data.signals && data.signals.length > 0) {
                        candlestickSeries.setMarkers(data.signals);
                    }
                } else {
                    alert("找不到該標的行情數據，請確認代碼（例如: BTCUSDT）");
                }
            } catch (err) {
                console.error("載入 K 線失敗:", err);
            }
        }
    </script>
</body>
</html>
