<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartNavigator</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#080a0e;--panel:#11151d;--line:#252c38;--muted:#8993a4;--cyan:#00d4ff;--up:#26a69a;--down:#ef5350}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#f4f6fa;font:14px system-ui,sans-serif} button,input,select{font:inherit} button{cursor:pointer}
    header{height:66px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0b0e14} h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
    .shell{max-width:1320px;margin:auto;padding:28px 20px}.search{position:relative;max-width:680px;margin:30px auto}.search input{width:100%;padding:15px 50px 15px 18px;border-radius:10px;border:1px solid #3b4656;background:#10151e;color:#fff;outline:none}.search input:focus{border-color:var(--cyan)}.search button{position:absolute;right:6px;top:6px;border:0;border-radius:7px;background:#1b2d36;color:var(--cyan);padding:9px 13px}
    #results{position:absolute;z-index:5;top:calc(100% + 5px);width:100%;background:#121720;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 16px 35px #000}.result{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#1b2430}.result small{color:var(--muted);display:block;margin-top:3px}
    .home-title{text-align:center;margin:36px 0 4px;font-size:28px}.home-note{text-align:center;color:var(--muted)}.rank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.ranking h2,.side h2{font-size:14px;margin:0;padding:15px;border-bottom:1px solid var(--line)}.rank-row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:10px 14px;border-bottom:1px solid #1d2430;cursor:pointer}.rank-row:hover{background:#18202b}.rank-row small{color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}
    #analysis-page{display:none}.analysis-top{display:flex;gap:12px;align-items:center;margin-bottom:16px}.back{background:#1a222e;color:#e5ebf5;border:1px solid #354052;border-radius:8px;padding:8px 12px}.source{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:18px}.toolbar{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.toolbar strong{margin-right:auto}.toolbar select{background:#161c26;color:#fff;border:1px solid #354052;border-radius:7px;padding:7px}.toggle{display:flex;gap:4px;align-items:center;color:#c3cad4;font-size:12px}.toggle input{accent-color:var(--cyan)}#chart{height:480px}#volume-chart{height:150px;border-top:1px solid var(--line)}
    .side{display:grid;align-content:start;gap:18px}.widget{padding:16px}.signal{text-align:center;padding:11px;border-radius:8px;font-weight:700}.BUY{background:var(--up);color:#05251e}.SELL{background:var(--down)}.HOLD{background:#303845}.metrics{display:grid;gap:9px;margin-top:14px;color:var(--muted)}.metrics div{display:flex;justify-content:space-between}.metrics b{color:#fff}.reason{line-height:1.55;color:var(--muted);font-size:12px}
    @media(max-width:760px){header{padding:0 16px;height:58px}.sub{display:none}.shell{padding:18px 12px}.home-title{font-size:23px;margin-top:22px}.rank-grid{grid-template-columns:1fr;margin-top:22px;gap:12px}.ranking:nth-child(3){margin-bottom:12px}.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr}.analysis-top{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:4}.toolbar{gap:7px}.toolbar strong{width:100%;margin:0}.toolbar select{flex:1;min-width:90px}#chart{height:360px}#volume-chart{height:120px}.toggle{padding:5px 3px}.widget{padding:14px}}
  </style>
</head>
<body>
  <header><div><h1>SmartNavigator</h1><div class="sub">市場掃描與多週期策略分析</div></div><div class="source">瀏覽次數 <span id="visit-count">—</span></div></header>
  <main class="shell">
    <section id="home-page"><h2 class="home-title">先選擇你要分析的市場</h2><p class="home-note">搜尋美股、台股、OKX 現貨或永續合約</p>
      <div class="search"><input id="asset-input" autocomplete="off" placeholder="輸入商品、代號，例如 台積電、NVDA、BTC-USDT"><button id="search-button">搜尋</button><div id="results" hidden></div></div>
      <div class="rank-grid"><section class="panel ranking"><h2>24H 漲幅 Top 10</h2><div id="gainers"></div></section><section class="panel ranking"><h2>24H 跌幅 Top 10</h2><div id="losers"></div></section><section class="panel ranking"><h2>24H 成交量 Top 10</h2><div id="volumes"></div></section></div>
    </section>
    <section id="analysis-page"><div class="analysis-top"><button id="back-button" class="back">← 返回市場總覽</button><span id="source-status" class="source"></span></div>
      <div class="layout"><section class="panel"><div class="toolbar"><strong id="chart-title">分析圖表</strong><select id="interval"><option value="1m">1 分</option><option value="3m">3 分</option><option value="5m">5 分</option><option value="10m">10 分</option><option value="15m">15 分</option><option value="30m">30 分</option><option value="45m">45 分</option><option value="1h" selected>1 小時</option><option value="2h">2 小時</option><option value="3h">3 小時</option><option value="4h">4 小時</option><option value="1d">日線</option><option value="1w">週線</option><option value="1mo">月線</option></select><select id="timezone"></select><label class="toggle"><input id="toggle-ema" type="checkbox">EMA</label><label class="toggle"><input id="toggle-levels" type="checkbox">撐壓</label><label class="toggle"><input id="toggle-choch" type="checkbox">CHoCH</label><label class="toggle"><input id="toggle-fvg" type="checkbox">FVG</label><label class="toggle"><input id="toggle-volume" type="checkbox">成交量</label></div><div id="chart"></div><div id="volume-chart" hidden></div></section>
      <aside class="side"><section class="panel widget"><h2>策略分析</h2><h3 id="strategy-name">等待載入</h3><p id="strategy-description" class="reason"></p><div id="signal" class="signal HOLD">等待分析</div><div class="metrics"><div>現價 <b id="price">—</b></div><div>目標 <b id="tp">—</b></div><div>停損 <b id="sl">—</b></div></div><p id="reason" class="reason"></p><p id="structure-note" class="reason">CHoCH 為結構轉變；FVG 為價格失衡區。</p></section></aside></div>
    </section>
  </main>
<script>
  let activeSymbol='', structureData=null, levelsData=null, searchTimer;
  const input=document.getElementById('asset-input'), results=document.getElementById('results');
  const chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#11151d'},textColor:'#c9ceda'},grid:{vertLines:{color:'#202938'},horzLines:{color:'#202938'}},timeScale:{timeVisible:true}});
  const volumeChart=LightweightCharts.createChart(document.getElementById('volume-chart'),{layout:{background:{color:'#11151d'},textColor:'#8993a4'},grid:{vertLines:{visible:false},horzLines:{color:'#202938'}},timeScale:{visible:false}});
  const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  const volume=volumeChart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:''}); volume.priceScale().applyOptions({scaleMargins:{top:.1,bottom:0}});
  const emaFast=chart.addSeries(LightweightCharts.LineSeries,{color:'#f0b90b',lineWidth:1,lastValueVisible:false,priceLineVisible:false});
  const emaSlow=chart.addSeries(LightweightCharts.LineSeries,{color:'#00d4ff',lineWidth:1,lastValueVisible:false,priceLineVisible:false});
  const emaTrend=chart.addSeries(LightweightCharts.LineSeries,{color:'#a78bfa',lineWidth:1,lastValueVisible:false,priceLineVisible:false});
  let markerPlugin=null, chochLines=[], fvgLines=[], levelLines=[];
  function formatTime(time){return new Intl.DateTimeFormat('zh-TW',{timeZone:document.getElementById('timezone').value,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(time*1000))}
  function timezoneList(){const sel=document.getElementById('timezone');const zones=typeof Intl.supportedValuesOf==='function'?Intl.supportedValuesOf('timeZone'):['UTC','Asia/Taipei'];['UTC',...zones.filter(z=>z!=='UTC')].forEach(z=>{const o=new Option(z,z,z==='Asia/Taipei',z==='Asia/Taipei');sel.add(o)});chart.applyOptions({localization:{timeFormatter:formatTime}})}
  function setMarkers(items){if(typeof LightweightCharts.createSeriesMarkers==='function'){markerPlugin??=LightweightCharts.createSeriesMarkers(candles,[]);markerPlugin.setMarkers(items)}else if(candles.setMarkers)candles.setMarkers(items)}
  function removeLines(lines){lines.forEach(x=>candles.removePriceLine(x));return []}
  function drawIndicators(){const checked=id=>document.getElementById(id).checked;emaFast.applyOptions({visible:checked('toggle-ema')});emaSlow.applyOptions({visible:checked('toggle-ema')});emaTrend.applyOptions({visible:checked('toggle-ema')});chochLines=removeLines(chochLines);fvgLines=removeLines(fvgLines);levelLines=removeLines(levelLines);let markers=[];
    if(checked('toggle-choch')&&structureData?.choch){const bull=structureData.choch.direction==='bullish';chochLines.push(candles.createPriceLine({price:structureData.choch.level,color:bull?'#00d4ff':'#ff4560',lineWidth:2,lineStyle:0,axisLabelVisible:true,title:bull?'Bullish CHoCH':'Bearish CHoCH'}));markers=structureData.markers||[]}
    if(checked('toggle-fvg'))(structureData?.fvg_zones||[]).forEach(z=>{const color=z.side==='bullish'?'#b56cff':'#ff9f43';fvgLines.push(candles.createPriceLine({price:z.low,color,lineWidth:1,lineStyle:2,axisLabelVisible:false,title:'FVG'}),candles.createPriceLine({price:z.high,color,lineWidth:1,lineStyle:2,axisLabelVisible:false,title:'FVG'}))});
    if(checked('toggle-levels')&&levelsData){levelLines.push(candles.createPriceLine({price:levelsData.resistance,color:'#f59e0b',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Resistance'}),candles.createPriceLine({price:levelsData.support,color:'#26a69a',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Support'}))};setMarkers(markers);document.getElementById('volume-chart').hidden=!checked('toggle-volume');}
  function showResults(items){results.replaceChildren();if(!items.length){results.textContent='找不到商品，請輸入代號，例如 2330.TW 或 AAPL。';results.hidden=false;return}items.slice(0,12).forEach(item=>{const row=document.createElement('div');row.className='result';row.innerHTML=`<b>${item.symbol}</b><small>${item.name||''} · ${item.type||''} · ${item.exchange||''}</small>`;row.onclick=()=>openAnalysis(item.symbol);results.append(row)});results.hidden=false}
  async function search(){const q=input.value.trim();if(!q)return;try{const r=await fetch(`/api/search?keyword=${encodeURIComponent(q)}`);const d=await r.json();showResults(d.results||[])}catch{showResults([])}}
  function openAnalysis(symbol){activeSymbol=symbol.toUpperCase();results.hidden=true;document.getElementById('home-page').style.display='none';document.getElementById('analysis-page').style.display='block';analyze()}
  async function analyze(){const signal=document.getElementById('signal');signal.className='signal HOLD';signal.textContent='讀取資料中…';try{const interval=document.getElementById('interval').value;const r=await fetch(`/api/analyze?symbol=${encodeURIComponent(activeSymbol)}&interval=${interval}`);const d=await r.json();if(!r.ok)throw Error(d.detail||'分析失敗');candles.setData(d.chart_data);volume.setData(d.chart_data.map(c=>({time:c.time,value:c.volume||0,color:c.close>=c.open?'#26a69a99':'#ef535099'})));emaFast.setData(d.ema_data?.fast||[]);emaSlow.setData(d.ema_data?.slow||[]);emaTrend.setData(d.ema_data?.trend||[]);structureData=d.structure;levelsData=d.levels;drawIndicators();chart.timeScale().fitContent();volumeChart.timeScale().fitContent();document.getElementById('chart-title').textContent=`${activeSymbol} · ${document.getElementById('interval').selectedOptions[0].text}`;document.getElementById('source-status').textContent=`資料來源：${d.market_source}`;signal.className=`signal ${d.direction}`;signal.textContent=d.message;['price','tp','sl'].forEach(id=>document.getElementById(id).textContent=d[id==='price'?'current_price':id]);document.getElementById('reason').textContent=d.reason;document.getElementById('strategy-name').textContent=d.strategy_name;document.getElementById('strategy-description').textContent=d.strategy_description;document.getElementById('structure-note').textContent=`CHoCH：${d.structure?.choch?d.structure.choch.direction+' 結構轉變':'尚未偵測到'}；FVG：${(d.structure?.fvg_zones||[]).length} 個價格失衡區。`}catch(e){signal.textContent=e.message}}
  function rankRows(id,rows,type){const box=document.getElementById(id);box.replaceChildren();rows.forEach((r,i)=>{const el=document.createElement('div');el.className='rank-row';const val=type==='volume'?`${(r.volume/1000000).toFixed(1)}M`:`${r.change>0?'+':''}${r.change}%`;el.innerHTML=`<small>${i+1}</small><span>${r.name}<small>${r.price}</small></span><b class="${r.change>=0?'up':'down'}">${val}</b>`;el.onclick=()=>openAnalysis(r.symbol);box.append(el)})}
  async function rankings(){try{const r=await fetch('/api/market-rankings');const d=await r.json();if(!r.ok)throw Error();rankRows('gainers',d.gainers);rankRows('losers',d.losers);rankRows('volumes',d.volume,'volume')}catch{['gainers','losers','volumes'].forEach(id=>document.getElementById(id).textContent='排行榜暫時無法載入')}}
  input.oninput=()=>{clearTimeout(searchTimer);if(input.value.trim().length>=1)searchTimer=setTimeout(search,220);else results.hidden=true};input.onkeydown=e=>{if(e.key==='Enter')search()};document.getElementById('search-button').onclick=search;document.getElementById('interval').onchange=analyze;document.getElementById('timezone').onchange=()=>chart.applyOptions({localization:{timeFormatter:formatTime}});document.getElementById('back-button').onclick=()=>{document.getElementById('analysis-page').style.display='none';document.getElementById('home-page').style.display='block';activeSymbol='';window.scrollTo(0,0)};['toggle-ema','toggle-levels','toggle-choch','toggle-fvg','toggle-volume'].forEach(id=>document.getElementById(id).onchange=drawIndicators);document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.hidden=true});new ResizeObserver(e=>{chart.applyOptions({width:e[0].contentRect.width});volumeChart.applyOptions({width:e[0].contentRect.width})}).observe(document.getElementById('chart'));timezoneList();fetch('/api/stats').then(r=>r.json()).then(d=>document.getElementById('visit-count').textContent=d.visits||0).catch(()=>{});rankings();
</script></body></html>
